<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>練球碼數本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="練球">
<meta name="theme-color" content="#F2F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column yardage-book app, entry pad on top, fixed tab bar at the bottom */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --ink:#15231B; --muted:#5D6B62; --line:#D9E0D8;
  --green:#1E5A39; --on-green:#FFFFFF; --green-soft:#E3EEE6;
  --flag:#E5AE16; --on-flag:#2E2200; --danger:#B3261E;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --ink:#E4ECE6; --muted:#93A198; --line:#29372E;
  --green:#4FA374; --on-green:#0B130E; --green-soft:#1D2D23;
  --flag:#F0C23A; --on-flag:#241A00; --danger:#F2786D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --ink:#E4ECE6; --muted:#93A198; --line:#29372E;
  --green:#4FA374; --on-green:#0B130E; --green-soft:#1D2D23;
  --flag:#F0C23A; --on-flag:#241A00; --danger:#F2786D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  margin:0;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.badge{font-family:var(--num);font-size:15px;font-weight:600;background:var(--green-soft);color:var(--green);padding:2px 10px;border-radius:99px;white-space:nowrap}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.clubs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-family:var(--num);font-size:20px;font-weight:600;text-align:center;min-width:0}
.pctgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip.pct{font-size:18px;padding:8px 0}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;padding:11px 4px;font-size:14px;font-weight:500;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;text-align:left}
.toggle .sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--flag)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.entry{display:grid;grid-template-columns:1fr 1fr 0.8fr;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input{width:100%;min-width:0;font-family:var(--num);font-size:34px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
.total{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--green-soft);padding:6px 4px;height:100%;min-height:60px}
.total small{font-size:12px;color:var(--muted)}
.total b{font-family:var(--num);font-size:30px;font-weight:700;color:var(--green);line-height:1.1}
.save{width:100%;border:0;border-radius:12px;background:var(--flag);color:var(--on-flag);font-size:18px;font-weight:700;padding:15px;letter-spacing:.1em}
.save:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.combo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.combo h3{margin:0;font-size:15px}
.avg{font-family:var(--num);font-size:16px;color:var(--muted)}
.avg b{color:var(--ink);font-size:20px}
.shots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.shots li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.shots li:first-child{border-top:0}
.shots .d{color:var(--muted);font-size:13px}
.shots .n{font-family:var(--num);font-size:19px;font-weight:600}
.shots .n span{color:var(--muted);font-weight:500;font-size:15px}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;color:var(--muted)}
.del.arm{border-color:var(--danger);color:var(--danger)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:center}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{font-size:12px;color:var(--muted);font-weight:500;padding:8px 4px;background:var(--surface)}
tbody th{font-family:var(--num);font-size:20px;font-weight:600;padding:0 10px;position:sticky;left:0;background:var(--surface);border-right:1px solid var(--line)}
td button{width:100%;border:0;background:transparent;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:0}
td .c{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1}
td .t{font-size:11px;color:var(--muted)}
section>.label+.tablebox{margin-bottom:16px}
td .none{color:var(--line);font-size:18px}
.entry.two{grid-template-columns:1fr 1fr}
.picks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.picks li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.picks li.best{border:2px solid var(--flag)}
.pk-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pk-club{font-family:var(--num);font-size:28px;font-weight:700;line-height:1}
.pk-sw{font-weight:500}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:auto}
.tag.ok{background:var(--green-soft);color:var(--green)}
.pk-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk-nums b{font-family:var(--num);font-size:20px;color:var(--ink)}
.pk-nums em{font-style:normal;font-size:12.5px;color:var(--green)}
.pk-rng{font-size:12.5px}
.pk-lbl{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--flag);color:var(--on-flag)}
.pk-lbl.alt{background:var(--green-soft);color:var(--green);font-weight:500}
.pk-warn{font-size:13px;color:var(--danger);font-weight:500}
.pk-why{font-size:13px;color:var(--muted);line-height:1.6}
.logic{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);line-height:1.6}
.logic b{color:var(--ink)}
.allbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:500}
.allcount{font-family:var(--num);font-size:17px;color:var(--green)}
.sheet.full{max-height:92%}
.sheet>*{flex-shrink:0}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-family:var(--num);font-size:17px;font-weight:600}
.fchip small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:400}
.fchip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.fchip[aria-pressed="true"] small{color:var(--on-green)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.grp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:4px;border-bottom:2px solid var(--flag)}
.grp-club{font-family:var(--num);font-size:24px;font-weight:700}
.grp-n{font-size:12.5px;color:var(--muted)}
.allshots li.editing{display:block;padding:10px 0}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.edgrid select,.edgrid input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
.edgrid input{font-family:var(--num);font-size:20px;font-weight:600}
.edopen{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px}
.edopen input{width:20px;height:20px;accent-color:var(--flag)}
.edbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edbtns .del{margin-left:auto;padding:8px 12px}
li.odd .n{opacity:.45;text-decoration:line-through}
.oddtag{font-style:normal;font-size:11px;padding:0 6px;border-radius:4px;background:var(--line);color:var(--muted)}
.edgrid.one{grid-template-columns:1fr;margin-top:8px}
.pk-mode{font-size:12.5px;color:var(--muted);margin:0}
.pk-mode b{color:var(--ink)}
.picks li.pk{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.pk-rank{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:17px;font-weight:700;background:var(--line);color:var(--muted)}
.pk.best .pk-rank{background:var(--flag);color:var(--on-flag)}
.pk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pk-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pk-chips{display:flex;gap:4px;flex-wrap:wrap}
.ck{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--green-soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.ck.ok{color:var(--green);font-weight:600}
.ck.bad{background:transparent;border:1px solid var(--danger);color:var(--danger);font-weight:600}
.ck.mute{background:var(--line);color:var(--muted)}
.pk-val{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;flex:0 0 auto}
.pk-val small{font-size:11px;color:var(--muted)}
.pk-val b{font-family:var(--num);font-size:28px;font-weight:700}
.pk-val small.near{color:var(--green);font-weight:700;font-size:13px}
.fold{padding:0}
.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;font-weight:500}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary>span:first-child{flex:1}
.sumv{font-size:13px;color:var(--muted);font-weight:400}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .15s}
.fold[open]>summary .chev{transform:rotate(-135deg);margin:4px 4px 0 2px}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.fold-body .note{margin:0}
.halfrow{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.halfrow .seg button{padding:9px 2px;font-size:13px}
.pctlist{display:flex;flex-direction:column;gap:8px}
.pctform{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center}
.pctform.def{padding-top:8px;border-top:1px dashed var(--line)}
.pctform input{min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.pctname{font-family:var(--num);font-size:20px;font-weight:600;display:flex;flex-direction:column;line-height:1.1}
.pctname small{font-family:var(--body);font-size:10.5px;font-weight:400;color:var(--muted)}
.mini.wide{grid-column:2/4;width:auto;height:auto;padding:4px 10px;font-size:12.5px;justify-self:start;color:var(--muted)}
.notestrip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;border:1px dashed var(--flag);background:var(--surface);text-align:left;min-width:0}
.ns-k{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--on-flag);background:var(--flag);padding:1px 8px;border-radius:6px}
.ns-t{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns-n{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.pk-note{border:0;background:transparent;padding:0;text-align:left;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.notes-full{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.notes-full>*{flex-shrink:0;width:100%;max-width:560px;margin-inline:auto}
.nhead h2{font-size:20px}
.nlist{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column}
.nlist li{border-top:1px solid var(--line)}
.nlist li:first-child{border-top:0}
.nlist li::marker{font-family:var(--num);font-weight:600;color:var(--green)}
.nitem{border:0;background:transparent;width:100%;text-align:left;padding:10px 4px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.nform{display:flex;flex-direction:column;gap:8px;padding:8px 0}
.nform.add{flex-direction:row;align-items:flex-end;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.nform textarea{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.cambtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--green);background:var(--surface);color:var(--green);border-radius:12px;padding:12px;font-weight:600}
.camico{width:20px;height:15px;border:2px solid currentColor;border-radius:4px;position:relative}
.camico::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border:2px solid currentColor;border-radius:50%;transform:translate(-50%,-50%)}
.camtag{font-style:normal;font-size:11px;padding:0 6px;border-radius:4px;background:var(--green-soft);color:var(--green)}
.xline{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-bottom:2px}
body.cam-on{overflow:hidden}
.cam{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.cam-top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.cam .x{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;flex:0 0 auto}
.cam-status{flex:1;min-width:0;text-align:center;font-size:13.5px;line-height:1.35}
.cam-status.ok{color:#8BE0AE}.cam-status.busy{color:#F0C23A}.cam-status.bad{color:#FF9A90}
.cam-stage{position:relative;flex:1;min-height:0}
.cam-stage video,.cam-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.cam-stage video{object-fit:contain}
.cam-stage canvas{touch-action:none}
.cam-bar{background:#0E1511;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;max-height:48%;overflow-y:auto}
.cam-calibbar p{margin:0;font-size:13px;line-height:1.5;color:#E4ECE6}
.cam-clubs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cam-clubs .chip{flex:0 0 auto;min-width:50px;padding:6px 8px;font-size:17px;background:#16201A;border-color:#29372E;color:#E4ECE6}
.cam-clubs .chip[aria-pressed="true"]{background:#4FA374;border-color:#4FA374;color:#0B130E}
.cam-row{display:flex;gap:8px}
.cam-row select{flex:1;font:inherit;font-size:15px;padding:7px 8px;border-radius:8px;border:1px solid #29372E;background:#16201A;color:#E4ECE6}
.cam-warn{font-size:13px;line-height:1.5;background:#3A2A06;border:1px solid #F0C23A;border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cam-warn .btn{padding:5px 10px;font-size:13px}
.cam-live{font-size:12px;color:#93A198;font-variant-numeric:tabular-nums;min-height:1em}
.cam-recent{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.cam-recent li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid #29372E;font-size:14px}
.cam-recent li:first-child{border-top:0}
.cr-c{font-family:var(--num);font-size:19px;font-weight:700;min-width:42px}
.cr-s{flex:1;color:#93A198;font-size:12.5px}
.cr-n b{font-family:var(--num);font-size:19px}
.cr-empty{color:#93A198;font-size:13px}
.cam-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cam-btns .btn{padding:11px;font-size:15px}
.cam .btn{background:#4FA374;border-color:#4FA374;color:#0B130E}
.cam .btn.ghost{background:transparent;color:#E4ECE6;border-color:#29372E}
.cam .btn:disabled{opacity:.4}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs button{border:0;background:transparent;padding:12px 0 14px;font-size:14px;font-weight:500;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--green);border-top-color:var(--flag)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:80%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{margin:0;font-size:18px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:24px}
.clublist{list-style:none;margin:0;padding:0}
.clublist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.clublist li:first-child{border-top:0}
.clublist .nm{flex:1;font-family:var(--num);font-size:20px;font-weight:600}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:36px;height:32px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{border:1px solid var(--green);background:var(--green);color:var(--on-green);border-radius:8px;padding:8px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--green)}
textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:9;white-space:nowrap}
.status{font-size:12.5px;color:var(--muted)}
.status.warn{color:var(--danger)}
@media (max-width:360px){.clubs{grid-template-columns:repeat(4,1fr)}.field input{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<div class="wrap" id="app"><p class="sub">載入中…</p></div>
<nav class="tabs" role="tablist" id="tabs">
  <button id="tab-log" role="tab" data-view="log">記錄</button>
  <button id="tab-table" role="tab" data-view="table">距離表</button>
  <button id="tab-pick" role="tab" data-view="pick">選桿</button>

<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<div id="cam" class="cam" hidden>
  <div class="cam-top"><button id="cam-close" class="x" type="button">關閉</button><div id="cam-status" class="cam-status"></div><button id="cam-calib" class="x" type="button">校正</button></div>
  <div class="cam-stage" id="cam-stage"><video id="cam-video" playsinline muted autoplay></video><canvas id="cam-ov"></canvas></div>
  <div class="cam-bar">
    <div id="cam-calibbar" class="cam-calibbar" hidden><p>把四個黃色圓點拖到 RG 數據欄的四個角：上緣對齊有名字的那一列頂端，下緣對齊「倒旋／側旋」那一列底部。綠框要框住數字。</p>
      <div class="cam-btns"><button id="cam-test" class="btn" type="button">測試讀取</button><button id="cam-reset" class="btn ghost" type="button">重設位置</button></div></div>
    <div class="cam-clubs" id="cam-clubs"></div>
    <div class="cam-row"><select id="cam-swing" aria-label="揮法"></select><select id="cam-face" aria-label="桿面"></select></div>
    <div id="cam-live" class="cam-live"></div>
    <div id="cam-warn" class="cam-warn" hidden></div>
    <ul id="cam-recent" class="cam-recent"></ul>
    <div class="cam-btns"><button id="cam-undo" class="btn ghost" type="button">撤銷上一球</button><button id="cam-run" class="btn" type="button">開始自動記錄</button></div>
  </div>
</div>

<script>
const SWINGS=[{k:'power',n:'出力全揮'},{k:'full',n:'正常全揮'},{k:'three',n:'3/4 揮'},{k:'half',n:'半揮'}];
const SW=Object.fromEntries(SWINGS.map(s=>[s.k,s.n]));
const isWedge=c=>{c=String(c).trim();return /°$/.test(c)||/^(PW|P|AW|GW|SW|LW)$/i.test(c)};
const FACES={square:'標準',open:'開桿面',closed:'關桿面'};
const faceOf=s=>s.face||(s.open===true?'open':'square');
const facesFor=c=>isWedge(c)?['open','square','closed']:['square'];
const faceTag=f=>!f||f==='square'?'':'・'+FACES[f];
function legacyKeys(clubs){const set=new Set(allShots().filter(s=>clubs.includes(s.club)&&!s.swing.startsWith('pct')).map(s=>s.swing));return SWINGS.map(x=>x.k).filter(k=>set.has(k))}
const swName=k=>k.startsWith('pct')?k.slice(3)+'%':(SW[k]||k);
const pctsFor=c=>(S.pctMap&&S.pctMap[c])||S.pcts;
// % swing keys for one club (its own list) or, with no club, the union across all wedge-type clubs (distance table columns).
function wedgeKeys(extraFromData,club){
  const base=club?pctsFor(club):[...new Set([S.pcts].concat(clubOrder().filter(isWedge).map(pctsFor)).flat())];
  const keys=base.map(p=>'pct'+p);
  if(extraFromData){for(const s of allShots())if(s.swing.startsWith('pct')&&(!club||s.club===club)&&!keys.includes(s.swing))keys.push(s.swing)}
  return keys.sort((a,b)=>+b.slice(3)-+a.slice(3));
}
function swingsFor(club){return isWedge(club)?wedgeKeys(false,club).map(k=>({k,n:swName(k)})):SWINGS}
const NEW_WOODS=['1W','3W','3H','4H'];
const DEFAULT_PCTS=[100,90,80,70,60,50,40,30,20,10];
const DEFAULT_CLUBS=['1W','3W','3H','4H','5i','6i','7i','8i','9i','PW','48°','54°','58°'];
const LS_KEY='yardbook-v1';
const YD_PER_M=1.0936;

const S={clubs:DEFAULT_CLUBS.slice(),unit:'yd',pcts:DEFAULT_PCTS.slice(),sessions:{},view:'log',face:'square',
  statMode:'mad',recency:{on:true,by:'count',half:50,days:60},pctMap:{},openSec:{},sel:{club:'7i',swing:'full',face:'square'},pick:{carry:'',total:'',bias:(()=>{try{return localStorage.getItem('yardbook-gh-bias')||'long'}catch(e){return'long'}})()},notes:{open:false,club:'all',edit:null},all:{open:false,filter:'all',edit:null},mode:'loading',armed:null,detail:null};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayId=d=>`s-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const toDisp=yd=>S.unit==='m'?yd/YD_PER_M:yd;
const fromIn=v=>S.unit==='m'?v*YD_PER_M:v;
const r0=v=>Math.round(toDisp(v));
const U=()=>S.unit==='m'?'公尺':'碼';

/* ---------- storage: this device first, synced through a private GitHub Gist ---------- */
const LS_DATA='yardbook-gh-data', LS_CFG='yardbook-gh-sync', GIST_FILE='yardbook-data.json', GH='https://api.github.com';
let D={shots:{},deleted:{},settings:null,notes:{}};
const sync={token:'',gistId:'',last:0,rev:0,busy:false,status:'off',timer:null};
function loadCfg(){try{const v=JSON.parse(localStorage.getItem(LS_CFG)||'{}');sync.token=v.token||'';sync.gistId=v.gistId||'';sync.last=v.last||0}catch(e){}}
function saveCfg(){try{localStorage.setItem(LS_CFG,JSON.stringify({token:sync.token,gistId:sync.gistId,last:sync.last}))}catch(e){}}
function saveLocalData(){try{localStorage.setItem(LS_DATA,JSON.stringify(D))}catch(e){toast('手機儲存空間不足，請先匯出備份')}}
function applySettings(st){if(!st)return;S.clubs=(st.clubs||DEFAULT_CLUBS).slice();S.unit=st.unit||'yd';S.pcts=(st.pcts||DEFAULT_PCTS).slice();S.pctMap=Object.assign({},st.pctMap||{});S.statMode=st.statMode||'mad';S.recency=Object.assign({on:true,by:'count',half:50,days:60},st.recency||{});fixSel()}
function rebuild(){const ss={};for(const id in D.shots){if(D.deleted[id])continue;const s=D.shots[id];const k=dayId(new Date(s.t));(ss[k]=ss[k]||{shots:[]}).shots.push(s)}S.sessions=ss}
function changed(){saveLocalData();sync.rev++;scheduleSync(2000)}
function persistSettings(){D.settings={clubs:S.clubs.slice(),unit:S.unit,pcts:S.pcts.slice(),pctMap:Object.assign({},S.pctMap),statMode:S.statMode,recency:Object.assign({},S.recency),updated:Date.now()};changed()}
function loadLocal(){
  try{const v=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(v)D={shots:v.shots||{},deleted:v.deleted||{},settings:v.settings||null,notes:v.notes||{}}}catch(e){}
  if(D.settings)applySettings(D.settings);
  rebuild();
}
function merge(a,b){
  const out={shots:Object.assign({},a.shots),deleted:Object.assign({},a.deleted,b.deleted),settings:null};
  for(const id in b.shots){const x=b.shots[id],y=out.shots[id];if(!y||(x.u||x.t)>=(y.u||y.t))out.shots[id]=x}
  for(const id in out.deleted)delete out.shots[id];
  const sa=a.settings,sb=b.settings;out.settings=!sa?sb||null:!sb?sa:(sb.updated>sa.updated?sb:sa);
  out.notes=Object.assign({},a.notes||{});for(const c in (b.notes||{})){const x=b.notes[c],y=out.notes[c];if(!y||x.updated>=y.updated)out.notes[c]=x}
  return out;
}
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const sig=x=>canon({shots:x.shots||{},deleted:x.deleted||{},settings:x.settings||null,notes:x.notes||{}});
async function gh(path,opt={}){
  const headers={'Authorization':'Bearer '+sync.token,'Accept':'application/vnd.github+json'};
  if(opt.body)headers['Content-Type']='application/json';
  const r=await fetch(GH+path,Object.assign({},opt,{headers,cache:'no-store'}));
  if(r.status===401||r.status===403)throw new Error('auth');
  if(r.status===404)throw new Error('missing');
  if(!r.ok)throw new Error('http');
  return r.json();
}
async function findGist(){
  for(let page=1;page<=10;page++){const list=await gh(`/gists?per_page=100&page=${page}`);
    const g=list.find(x=>x.files&&x.files[GIST_FILE]);if(g)return g.id;if(list.length<100)break}
  return '';
}
async function readGist(){
  const g=await gh('/gists/'+sync.gistId);const f=g.files&&g.files[GIST_FILE];
  if(!f)return{shots:{},deleted:{},settings:null,notes:{}};
  let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});txt=await r.text()}
  try{const v=JSON.parse(txt);return{shots:v.shots||{},deleted:v.deleted||{},settings:v.settings||null,notes:v.notes||{}}}catch(e){return{shots:{},deleted:{},settings:null,notes:{}}}
}
function scheduleSync(ms){if(!sync.token)return;clearTimeout(sync.timer);sync.timer=setTimeout(doSync,ms)}
async function doSync(){
  if(!sync.token)return;
  if(sync.busy){scheduleSync(1500);return}
  if(!navigator.onLine){sync.status='offline';renderSync();return}
  sync.busy=true;sync.status='syncing';renderSync();
  const revAtStart=sync.rev;
  try{
    if(!sync.gistId){sync.gistId=await findGist();saveCfg()}
    if(!sync.gistId){
      const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'練球碼數本 同步資料（請勿刪除）',public:false,files:{[GIST_FILE]:{content:JSON.stringify(D)}}})});
      sync.gistId=g.id;
    }else{
      let remote;
      try{remote=await readGist()}catch(e){if(e.message==='missing'){sync.gistId='';saveCfg();throw new Error('retry')}throw e}
      const before=sig(D), m=merge(remote,D), after=sig(m);
      D=m;saveLocalData();
      if(after!==before){if(D.settings)applySettings(D.settings);rebuild();render()}
      if(after!==sig(remote))await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(m)}}})});
    }
    sync.last=Date.now();sync.status='ok';
  }catch(e){sync.status=e.message==='auth'?'auth':'error';if(e.message==='retry')scheduleSync(500)}
  finally{
    sync.busy=false;saveCfg();
    if(sync.rev!==revAtStart&&sync.status==='ok')scheduleSync(800);
    renderSync();
  }
}
function syncText(){
  const ago=sync.last?fmtDate(sync.last):'';
  if(!sync.token)return['warn','尚未設定同步，紀錄只存在這台裝置。到「設定」連結 GitHub 後，所有裝置都能看到同一份紀錄。'];
  if(sync.status==='syncing')return['','同步中…'];
  if(sync.status==='offline')return['warn','目前離線，紀錄先存在這台裝置，有網路時會自動同步。'];
  if(sync.status==='auth')return['warn','GitHub 金鑰無效或已過期，請到「設定」重新貼上。'];
  if(sync.status==='error')return['warn','同步失敗，紀錄已存在這台裝置，稍後會再試。'];
  return['',`已同步${ago?'（'+ago+'）':''}`];
}
function renderSync(){const el=document.getElementById('syncline');if(el){const[c,t]=syncText();el.className='status '+c;el.textContent=t}
  const st=document.getElementById('sync-state');if(st)st.textContent=syncText()[1];}
function init(){
  loadCfg();loadLocal();S.mode='gh';fixSel();render();
  if(sync.token)doSync();
  window.addEventListener('online',()=>scheduleSync(300));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(300)});
}
function migrate(){S.clubs=NEW_WOODS.filter(c=>!S.clubs.includes(c)).concat(S.clubs);S.pcts=DEFAULT_PCTS.slice()}
function fixSel(){if(!S.clubs.includes(S.sel.club))S.sel.club=S.clubs[0]||'';const ks=swingsFor(S.sel.club).map(x=>x.k);if(!ks.includes(S.sel.swing))S.sel.swing=isWedge(S.sel.club)?ks[0]:'full';if(!facesFor(S.sel.club).includes(S.sel.face))S.sel.face='square'}

/* ---------- data helpers ---------- */
function allShots(){const out=[];for(const id in S.sessions)for(const s of S.sessions[id].shots)out.push(s);return out.sort((a,b)=>b.t-a.t)}
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
// MAD outlier screen on carry (see 設定 → 距離統計方式). Short misses are flagged sooner than long ones.
// Recency weights within one club/swing/face group (see 設定 → 近期加權). Newest shot = 1, halves every half-life.
function weightsFor(shots){
  const Rc=S.recency;if(!Rc||!Rc.on||!shots.length)return shots.map(()=>1);
  if(Rc.by==='time'){const newest=Math.max(...shots.map(s=>s.t));return shots.map(s=>Math.pow(.5,(newest-s.t)/(Rc.days*864e5)))}
  const w=new Array(shots.length);shots.map((s,i)=>[s.t,i]).sort((a,b)=>b[0]-a[0]).forEach(([,i],rank)=>w[i]=Math.pow(.5,rank/Rc.half));return w;
}
function wMedian(vals,ws){const a=vals.map((v,i)=>[v,ws[i]]).sort((x,y)=>x[0]-y[0]),tot=a.reduce((s,x)=>s+x[1],0);let c=0;
  for(let i=0;i<a.length;i++){c+=a[i][1];if(c>=tot/2-1e-9){if(Math.abs(c-tot/2)<1e-9&&i+1<a.length)return(a[i][0]+a[i+1][0])/2;return a[i][0]}}return a[a.length-1][0]}
const wMean=(vals,ws)=>{let a=0,b=0;vals.forEach((v,i)=>{a+=v*ws[i];b+=ws[i]});return b?a/b:null};
const effN=ws=>{let a=0,b=0;for(const w of ws){a+=w;b+=w*w}return b?a*a/b:0};
function wSd(vals,ws){const m=wMean(vals,ws),ne=effN(ws);if(ne<=1.5)return null;let a=0,b=0;vals.forEach((v,i)=>{a+=ws[i]*(v-m)**2;b+=ws[i]});return Math.sqrt(a/b*ne/(ne-1))}
// MAD outlier screen on carry (see 設定 → 距離統計方式), using recency-weighted median. Short misses are flagged sooner than long ones.
function splitOutliers(shots,ws){
  ws=ws||weightsFor(shots);
  if(S.statMode==='mean'||shots.length<6)return{used:shots,uw:ws,out:[]};
  const cs=shots.map(s=>s.carry),med=wMedian(cs,ws);
  const sig=Math.max(2,1.4826*wMedian(cs.map(c=>Math.abs(c-med)),ws));
  const used=[],uw=[],out=[];
  shots.forEach((s,i)=>{const d=s.carry-med;if(d<-2.5*sig||d>3*sig)out.push(s);else{used.push(s);uw.push(ws[i])}});
  return{used,uw,out};
}
function statsFor(shots){
  const n=shots.length;if(!n)return{n:0,used:0,out:0,neff:0,carry:null,total:null,min:null,max:null,sd:null};
  const{used,uw,out}=splitOutliers(shots),cs=used.map(s=>s.carry),ts=used.map(s=>s.carry+s.roll);
  const useMed=S.statMode!=='mean'&&n>=3&&n<=5;
  return{n,used:used.length,out:out.length,neff:effN(uw),carry:useMed?wMedian(cs,uw):wMean(cs,uw),total:useMed?wMedian(ts,uw):wMean(ts,uw),
    min:Math.min(...cs),max:Math.max(...cs),sd:used.length>=3?wSd(cs,uw):null};
}
let OUT=new Set();
function computeOutliers(){const g={};for(const s of allShots()){const k=s.club+'|'+s.swing+'|'+faceOf(s);(g[k]=g[k]||[]).push(s)}
  const set=new Set();for(const k in g)for(const s of splitOutliers(g[k]).out)set.add(s.id);return set}
function match(club,swing,face){return allShots().filter(s=>s.club===club&&s.swing===swing&&faceOf(s)===face)}

/* ---------- club picker ---------- */
// Starting estimates (total yards, normal full swing) used only until a combo has its own shots.
const EST={'1W':230,'3W':210,'3H':190,'4H':180,'5i':165,'6i':155,'7i':145,'8i':135,'9i':125,'PW':115,'48°':107,'54°':92,'58°':78};
const ROLL_SHARE=c=>/W$/.test(c)?0.12:/H$/.test(c)?0.08:isWedge(c)?0.03:0.06;
function sdOf(a){if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))}
// Every club + swing + face you have shots for, plus starting estimates for full swings with no shots yet.
function candidates(){
  const out=[];
  for(const club of clubOrder()){
    const keys=isWedge(club)?wedgeKeys(true,club).concat(legacyKeys([club])):SWINGS.map(x=>x.k);
    for(const k of keys)for(const face of facesFor(club)){
      const st=statsFor(match(club,k,face));
      if(st.n){
        const sd=Math.max(3,st.sd==null?Math.max(4,0.05*st.carry):st.sd);
        out.push({club,swing:k,face,carry:st.carry,total:st.total,roll:st.total-st.carry,n:st.n,sd,low:st.carry-sd,est:false});
      }else if(face==='square'&&(k==='full'||k==='pct100')&&EST[club]&&S.clubs.includes(club)){
        const t=EST[club],c=t*(1-ROLL_SHARE(club)),sd=Math.max(4,0.06*c);
        out.push({club,swing:k,face,carry:c,total:t,roll:t-c,n:0,sd,low:c-sd,est:true});
      }
    }
  }
  return out;
}
// Approach-shot logic (see 設定 → 選桿邏輯).
const SWING_PEN={full:0,three:3,half:4,power:8};
function recommend(C,T){
  const longFirst=S.pick.bias!=='short';
  const w=d=>d<0?(longFirst?1.5:1)*-d:(longFirst?1:1.5)*d;   // short/long miss weighting
  const room=C!=null&&T!=null?T-C:null;                       // roll space between carry point and target
  const list=candidates().map(c=>{
    const metric=T!=null?c.total:c.carry, pass=C==null||c.low>=C;
    let pen=(isWedge(c.club)?0:(SWING_PEN[c.swing]||0))+(c.n>=3?c.sd:3)*0.3+(c.est?5:0)+(c.face!=='square'?3:0);
    const rollOver=room!=null&&c.roll-room>3;if(rollOver)pen+=(c.roll-room)*0.5;
    return Object.assign({},c,{pass,rollOver,metric,score:w(metric-(T!=null?T:C))+pen});
  });
  list.sort((a,b)=>(b.pass-a.pass)||(a.score-b.score));
  return list.length?{list:list.slice(0,5),C,T,room}:null;
}
function pickCard(c,i,res){
  const dv=Math.round(toDisp(c.metric-(res.T!=null?res.T:res.C)));
  const chips=[];
  if(res.C!=null)chips.push(c.pass?`<span class="ck ok">飛過 ✓ 餘 ${Math.round(toDisp(c.low-res.C))}</span>`:`<span class="ck bad">⚠ 可能飛不過</span>`);
  if(res.room!=null)chips.push(c.rollOver?`<span class="ck bad">⚠ 滾過頭 ${r0(c.roll)}</span>`:`<span class="ck">滾 ${r0(c.roll)}</span>`);
  chips.push(`<span class="ck">±${Math.round(toDisp(c.sd))}</span>`);
  chips.push(c.est?`<span class="ck mute">預估</span>`:`<span class="ck">${c.n}球</span>`);
  return `<li class="pk ${i===0?'best':''}"><span class="pk-rank">${i+1}</span>
    <div class="pk-body"><div class="pk-top"><span class="pk-club">${esc(c.club)}</span><span class="pk-sw">${swName(c.swing)}${faceTag(c.face)}</span></div>
      <div class="pk-chips">${chips.join('')}</div>${notesFor(c.club).length?`<button class="pk-note" data-notes="${esc(c.club)}">注意：${esc(notesFor(c.club)[0].text)}${notesFor(c.club).length>1?`（共 ${notesFor(c.club).length} 項）`:''}</button>`:''}</div>
    <div class="pk-val"><small>${res.T!=null?'總距離':'carry'}</small><b>${r0(c.metric)}</b><small class="${Math.abs(dv)<=3?'near':''}">${dv===0?'剛好':dv>0?'+'+dv:dv}</small></div></li>`;
}
function viewPickResults(){
  const tc=num(S.pick.carry),tt=num(S.pick.total);

  if(!res)return `<p class="empty">還沒有可以比對的紀錄。</p>`;

  return `<p class="pk-mode"><b>${mode}</b>・${S.pick.bias==='short'?'寧短勿長':'寧長勿短'}・排序：${tc!=null?'能否飛過 → ':''}距離誤差 → 揮法與穩定度</p>

}

function addShot(carry,roll){
  const now=new Date(),id=dayId(now);
  const shot={id:now.getTime().toString(36)+Math.random().toString(36).slice(2,6),t:now.getTime(),club:S.sel.club,swing:S.sel.swing,face:S.sel.face,open:S.sel.face==='open',
    carry:Math.round(fromIn(carry)*10)/10,roll:Math.round(fromIn(roll)*10)/10};
  D.shots[shot.id]=shot;rebuild();changed();
  toast(`已記錄 ${S.sel.club} ${swName(S.sel.swing)}${faceTag(S.sel.face)}　${carry}+${roll}`);
}
function deleteShot(shotId){
  D.deleted[shotId]=Date.now();delete D.shots[shotId];rebuild();changed();
  S.armed=null;render();
}

  </div></details>
  <details class="card fold" data-sec="sec3" ${S.openSec.sec3?'open':''}><summary><span>挖起桿與 PW 揮桿幅度（%）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="pctlist">${S.clubs.filter(isWedge).map((c,i)=>`<form class="pctform" data-pclub="${esc(c)}">
      <label class="pctname" for="pct-in-${i}">${esc(c)}${S.pctMap[c]?'':'<small>預設</small>'}</label>
      <input id="pct-in-${i}" inputmode="decimal" value="${pctsFor(c).join(', ')}" aria-label="${esc(c)} 揮桿幅度">

      ${S.pctMap[c]?`<button class="mini wide" type="button" data-pctreset="${esc(c)}">改回預設</button>`:''}</form>`).join('')}
      <form class="pctform def" data-pclub="">

      <button class="btn" type="submit">儲存</button></form></div>
    <p class="note">每支球桿可以各自設定，用逗號分隔，例如 54° 填 100, 80, 60, 40, 20。標示「預設」的球桿使用最下面的預設值（100% 到 10%，每 10% 一格），之後新增的挖起桿也會先用預設值。PW 和名稱以「°」結尾的球桿會用百分比記錄，並可選開桿面、標準、關桿面；其他球桿維持出力／正常全揮。舊紀錄不會因修改而消失，距離表仍會顯示。</p></div></details>
  <details class="card fold" data-sec="sec4" ${S.openSec.sec4?'open':''}><summary><span>距離單位</span><span class="sumv">${S.unit==='m'?'公尺':'碼'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="seg two"><button data-unit="yd" aria-pressed="${S.unit==='yd'}">碼</button><button data-unit="m" aria-pressed="${S.unit==='m'}">公尺</button></div>
    <p class="note">切換單位會自動換算所有舊紀錄。</p></div></details>
  <details class="card fold" data-sec="sec5" ${S.openSec.sec5?'open':''}><summary><span>匯出紀錄（CSV）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <button class="btn ghost" id="export">複製全部紀錄</button>
    <textarea id="csv" readonly hidden></textarea>
    <p class="note">複製後可以貼到 Excel 或 Google 試算表。</p></div></details>
  <details class="card fold" data-sec="sec6" ${S.openSec.sec6?'open':''}><summary><span>距離統計方式</span><span class="sumv">${S.statMode==='mean'?'全部平均':'排除異常球'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="seg two"><button data-stat="mad" aria-pressed="${S.statMode!=='mean'}">排除異常球（建議）</button><button data-stat="mean" aria-pressed="${S.statMode==='mean'}">全部平均</button></div>
    <ol class="logic">
      <li><b>6 球以上：用 MAD 找出異常球。</b>先找這組 carry 的中位數（開啟近期加權時用加權中位數），再算每球和中位數相差多少，取這些差距的中位數（MAD）。MAD 乘以 1.48 換算成標準差的大小，作為「正常落差」，最少 2 碼。</li>
      <li><b>異常門檻：</b>比中位數短超過 2.5 倍正常落差、或長超過 3 倍，就視為異常，不計入平均。打短多半是打肥、打薄，所以打短的門檻較嚴。</li>
      <li><b>3～5 球：</b>球數太少，不排除任何球，改用中位數，避免單一球影響太大。<b>少於 3 球：</b>直接平均。</li>
      <li><b>只用 carry 判斷：</b>滾動受地面軟硬影響大，不拿來判斷。被排除的球，滾動與總距離也一起不計。</li>
      <li><b>不會刪除資料：</b>被排除的球在明細和全部紀錄中以灰色標示「異常」，你可以自行判斷，需要時再編輯或刪除。</li>
      <li><b>全部平均：</b>所有球直接取平均，不排除任何球；開啟近期加權時為加權平均。</li>
      <li>每支球桿、每種揮法、每種桿面各自分開計算。選桿頁的落差（±）也是用排除異常後的球計算。</li>
    </ol></div></details>
  <details class="card fold" data-sec="sec8" ${S.openSec.sec8?'open':''}><summary><span>近期加權</span><span class="sumv">${!S.recency.on?'關閉':S.recency.by==='time'?S.recency.days+' 天':S.recency.half+' 球'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="seg three"><button data-rec="off" aria-pressed="${!S.recency.on}">關閉</button><button data-rec="count" aria-pressed="${S.recency.on&&S.recency.by!=='time'}">依球數</button><button data-rec="time" aria-pressed="${S.recency.on&&S.recency.by==='time'}">依時間</button></div>
    ${S.recency.on?`<div class="halfrow"><span>半衰期</span><div class="seg" style="grid-template-columns:repeat(5,1fr)">${(S.recency.by==='time'?[30,60,90,180,365]:[20,30,50,100,200]).map(v=>`<button data-half="${v}" aria-pressed="${(S.recency.by==='time'?S.recency.days:S.recency.half)===v}">${v}${S.recency.by==='time'?' 天':' 球'}</button>`).join('')}</div></div>`:''}
    <ol class="logic">
      <li><b>用途：</b>揮桿會隨練習改變，越近期打的球越能代表現在的距離。開啟後每一球都還會計入，但越舊的球權重越低。</li>
      <li><b>依球數（預設）：</b>同一支球桿、同一種揮法和桿面，依打球先後排序。最新的一球權重 100%，每往前推一個半衰期，權重減半。以半衰期 50 球為例：最新 1～50 球權重 100%～50%，51～100 球 50%～25%，101～150 球 25%～12%，151～200 球 12%～6%。</li>
      <li><b>依時間：</b>以這組最新一球的日期為準，每過一個半衰期（天數）權重減半。同一天打的球權重相同，不會因為當天打得多而讓較早的球吃虧。</li>
      <li><b>平均與異常球：</b>平均距離改為加權平均。3～5 球時用加權中位數。排除異常球時，也用加權中位數判斷正常距離，讓最近的球決定標準；揮桿進步後，新的長球不會被當成異常。</li>
      <li><b>適用範圍：</b>距離表、記錄頁的平均、選桿推薦都會套用。紀錄本身不會改變，關閉後立即恢復一般計算。</li>
    </ol></div></details>
  <details class="card fold" data-sec="sec7" ${S.openSec.sec7?'open':''}><summary><span>選桿邏輯（攻果嶺）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <ol class="logic">
      <li><b>只填總距離：一般攻果嶺。</b>找平均總距離最接近目標的組合。選「寧長勿短」時，打短 1 碼算 1.5 碼誤差、打長 1 碼算 1 碼；「寧短勿長」則相反。</li>
      <li><b>只填 carry：必須飛過。</b>用「穩定 carry 下限」判斷，也就是平均 carry 減掉你這個組合的落差。下限要大於等於目標才列為首選，否則標示「可能飛不過」。符合的組合中挑 carry 最接近目標的，避免拿太長的桿飛過果嶺。</li>
      <li><b>兩個都填：飛過障礙＋停在目標附近。</b>先要求穩定 carry 下限飛過障礙，再挑總距離最接近目標的。若平常的滾動比「目標總距離 − carry」多 3 碼以上，會往後排並標示「可能滾過頭」，開桿面或高拋的挖起桿因此較容易被推薦。</li>
      <li><b>揮法優先順序：</b>鐵桿和木桿以正常全揮最優先，3/4 揮、半揮依序往後，出力全揮放最後。挖起桿與 PW 的各種幅度不扣分。開桿面和關桿面平常稍微往後排；兩欄都填且滾動空間不夠時，滾得少的開桿面較容易排到前面。</li>
      <li><b>穩定度與資料量：</b>3 球以上時，落差越小越優先，落差依「距離統計方式」與「近期加權」計算。<b>紀錄球數少不會往後排</b>：少於 3 球時排序視同落差 3 碼。不過判斷「能否飛過」時，仍以 carry 的 5%（最少 4 碼）估算落差，避免把不確定的球桿當成一定飛得過。還沒有任何紀錄的球桿用一般距離估算，標示「預估」並排在後面。</li>
      <li><b>結果顯示：</b>依分數排出前 5 名。右邊大字是平均總距離（只填 carry 時是平均 carry），下方是和目標差幾碼，3 碼以內以綠色標示。小標籤依序是：能否飛過與餘裕、平常滾動、落差（±）、紀錄球數。紅色標籤表示可能飛不過或滾過頭。</li>
    </ol></div></details>${statusLine()}`;
}

// bilinear map from panel (u,v) to normalized video coords
function camMap(u,v){const[tl,tr,br,bl]=CAM.quad;const top=[tl[0]+(tr[0]-tl[0])*u,tl[1]+(tr[1]-tl[1])*u],bot=[bl[0]+(br[0]-bl[0])*u,bl[1]+(br[1]-bl[1])*u];

function camFieldRect(k){const[u0,v0,u1,v1]=RG_FIELDS[k];const pts=[camMap(u0,v0),camMap(u1,v0),camMap(u1,v1),camMap(u0,v1)];

async function camWL(kind){if(CAM.wl===kind)return;CAM.wl=kind;

/* --- image prep: crop field, scale, Otsu threshold → dark text on white --- */
function camPrep(k){
  const v=camEl('cam-video'),W=v.videoWidth,H=v.videoHeight;if(!W)return null;
  const[x0,y0,x1,y1]=camFieldRect(k);const sx=Math.max(0,x0*W),sy=Math.max(0,y0*H),sw=Math.min(W,x1*W)-sx,sh=Math.min(H,y1*H)-sy;
  if(sw<4||sh<4)return null;
  const scale=Math.max(1,Math.min(4,64/sh)),dw=Math.round(sw*scale),dh=Math.round(sh*scale),pad=12;
  const c=document.createElement('canvas');c.width=dw+pad*2;c.height=dh+pad*2;const g=c.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingEnabled=true;g.drawImage(CAM.frame,sx,sy,sw,sh,pad,pad,dw,dh);

  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=128;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,b=wB*wF*(mB-mF)*(mB-mF);if(b>best){best=b;th=t}}
  let bright=0;for(let i=0;i<n;i++)if(gray[i]>th)bright++;

  const inkA=new Uint8Array(n);for(let i=0;i<n;i++)inkA[i]=(textBright?gray[i]>th:gray[i]<=th)?1:0;
  if(k!=='club')camClean(inkA,dw,dh,k==='shots');
  for(let i=0;i<n;i++){const val=inkA[i]?0:255;o[i*4]=o[i*4+1]=o[i*4+2]=val;o[i*4+3]=255}
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.putImageData(out,pad,pad);

  const GX=24,GY=6;for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){let ink=0,cnt=0;
    for(let y=Math.floor(gy*dh/GY);y<Math.floor((gy+1)*dh/GY);y+=2)for(let x=Math.floor(gx*dw/GX);x<Math.floor((gx+1)*dw/GX);x+=2){cnt++;if(o[(y*dw+x)*4]===0)ink++}
    bits+=cnt&&ink/cnt>.25?'1':'0'}
  return{canvas:c,bits};
}
// Keep the digits: drop unit labels (yds, mph, rpm, deg) and stray marks by component size/position.
function camClean(ink,w,h,lastGroup){
  const lab=new Int32Array(w*h).fill(-1),comps=[],st=[];
  for(let i=0;i<w*h;i++){if(!ink[i]||lab[i]>=0)continue;const c={x0:w,y0:h,x1:0,y1:0,n:0,id:comps.length};st.push(i);lab[i]=c.id;
    while(st.length){const j=st.pop(),x=j%w,y=(j/w)|0;c.n++;if(x<c.x0)c.x0=x;if(x>c.x1)c.x1=x;if(y<c.y0)c.y0=y;if(y>c.y1)c.y1=y;
      const nb=[x>0?j-1:-1,x<w-1?j+1:-1,y>0?j-w:-1,y<h-1?j+w:-1];for(const q of nb)if(q>=0&&ink[q]&&lab[q]<0){lab[q]=c.id;st.push(q)}}
    c.h=c.y1-c.y0+1;c.w=c.x1-c.x0+1;comps.push(c)}
  const big=comps.filter(c=>c.n>15);if(!big.length)return;
  const maxH=Math.max(...big.map(c=>c.h));let tall=big.filter(c=>c.h>=.6*maxH).sort((a,b)=>a.x0-b.x0);if(!tall.length)return;
  if(lastGroup&&tall.length>1){let gi=0,gap=0;for(let i=1;i<tall.length;i++){const g=tall[i].x0-tall[i-1].x1;if(g>gap){gap=g;gi=i}}if(gap>.45*maxH)tall=tall.slice(gi)}
  const L=Math.min(...tall.map(c=>c.x0)),Rt=Math.max(...tall.map(c=>c.x1)),T=Math.min(...tall.map(c=>c.y0)),B=Math.max(...tall.map(c=>c.y1));

    const dot=c.h<=.35*maxH&&c.w<=.4*maxH&&c.x0>L&&c.x1<Rt&&c.y1>=B-.3*maxH&&c.y1<=B+.15*maxH;
    const minus=c.h<=.3*maxH&&c.w>=c.h*1.4&&c.x1<=L+.2*maxH&&c.x0>=L-1.2*maxH&&cy>T+.25*maxH&&cy<B-.25*maxH;

function camSame(a,b){if(!a||!b||a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i]&&++d>3)return false;return true}
function camParse(k,txt){
  const t=(txt||'').replace(/\s/g,'').replace(/\.+$/,'');let m;
  if(k==='shots'){m=t.match(/\d{1,4}/);return m?+m[0]:null}
  if(k==='sf'){m=t.match(/\d\.\d{2}/);return m?+m[0]:null}
  if(k==='bsp'||k==='ssp'){m=t.match(/-?\d{1,5}/);return m?+m[0]:null}
  if(k==='club'){const u=t.toUpperCase().replace(/^1(?=\d)/,'I');m=u.match(/^[WIUSP](\d{0,2})/);return m?m[0]:null}
  m=t.match(/-?\d{1,3}\.\d/);if(m)return +m[0];
  m=t.match(/^(-?)(\d{2,4})$/);if(m)return +(m[1]+m[2].slice(0,-1)+'.'+m[2].slice(-1));   // RG always shows one decimal: a lost dot

async function camRead(k,force){
  const p=camPrep(k);if(!p)return null;
  if(!force&&camSame(p.bits,CAM.hash[k])&&k in CAM.vals)return CAM.vals[k];
  await camWL(k==='club'?'club':'num');
  const{data}=await CAM.worker.recognize(p.canvas);
  const val=camParse(k,data.text);CAM.hash[k]=p.bits;CAM.vals[k]=val;return val;
}
function camGrab(){const v=camEl('cam-video');if(!v.videoWidth)return false;
  if(!CAM.frame)CAM.frame=document.createElement('canvas');const f=CAM.frame;
  if(f.width!==v.videoWidth||f.height!==v.videoHeight){f.width=v.videoWidth;f.height=v.videoHeight}
  f.getContext('2d',{willReadFrequently:true}).drawImage(v,0,0);return true}

/* --- shot detection --- */
const camSig=r=>[r.total,r.carry,r.roll].join('|');
const camValid=r=>r.total!=null&&r.carry!=null&&r.roll!=null&&r.carry>0&&r.total>0&&r.total<=420&&r.roll>=-40&&Math.abs(r.carry+r.roll-r.total)<=1.0;
async function camStep(){
  if(!camGrab())return;
  const r={};for(const k of RG_KEY)r[k]=await camRead(k);
  camLive();const now=Date.now();
  if(r.shots!=null||r.total!=null)CAM.lastOk=now;
  if(now-CAM.lastOk>10000)camStatus('讀不到數據，請確認手機沒有移動，或重新校正','bad');
  if(!CAM.started){if(r.shots!=null||r.total!=null){CAM.started=true;CAM.base=r.shots;CAM.lastTotal=r.total;CAM.lastRec=camValid(r)?camSig(r):null;camStatus('等待擊球…','ok')}else camStatus('尋找數據欄…');return}
  if(CAM.state==='idle'){
    // a new shot: the 擊球數 counter changed, or the distance changed (fallback when the counter can't be read)
    const byCount=r.shots!=null&&CAM.base!=null&&r.shots!==CAM.base;
    const byValue=r.total!=null&&CAM.lastTotal!=null&&Math.abs(r.total-CAM.lastTotal)>0.05;
    const key=byCount?'c'+r.shots:byValue?'v':null;
    if(key){if(CAM.pend===key)CAM.pendN++;else{CAM.pend=key;CAM.pendN=1}
      if(CAM.pendN>=2){CAM.state='track';CAM.track={shots:byCount?r.shots:null,byCount,since:now,sig:null,sigSince:now};
        camStatus(`${byCount?'第 '+r.shots+' 球・':''}等待數字停止…`,'busy')}}
    else{CAM.pend=null;CAM.pendN=0;if(CAM.base==null&&r.shots!=null)CAM.base=r.shots;if(CAM.lastTotal==null&&r.total!=null)CAM.lastTotal=r.total}
    return;
  }
  const t=CAM.track;
  if(r.shots!=null&&r.shots!==CAM.base&&r.shots!==t.shots){t.shots=r.shots;t.byCount=true}
  const sig=r.total!=null&&r.carry!=null&&r.roll!=null?camSig(r):null;
  if(sig!==t.sig){t.sig=sig;t.sigSince=now}
  if(sig&&now-t.sigSince>=1500&&camValid(r)){
    // same numbers as the shot already recorded: only accept when the counter confirms a new shot and enough time has passed
    if(sig===CAM.lastRec&&!(t.byCount&&r.shots===t.shots&&now-t.since>=8000)){if(!t.byCount&&now-t.since>6000)camIdle(r);return}
    await camRecord(r,t.shots!=null?t.shots:r.shots);return;
  }
  if(now-t.since>25000){camIdle(r);camWarn(`有一球讀不到完整數字，沒有記錄。可以在記錄頁手動補記。`);beep(220)}
}
function camIdle(r){const t=CAM.track||{};CAM.state='idle';CAM.base=t.shots!=null?t.shots:r.shots!=null?r.shots:CAM.base;CAM.lastTotal=r.total!=null?r.total:CAM.lastTotal;CAM.pend=null;CAM.pendN=0;camStatus('等待擊球…','ok')}
function rgClubCheck(code,club){
  if(!code)return null;const L=code[0],n=code.slice(1);let want=null,ok=true,label=code;
  if(L==='W'&&n){want=n+'W';ok=club===want}
  else if(L==='I'&&n){want=n+'i';ok=club===want}
  else if(L==='P'){want='PW';ok=club==='PW'}
  else if(L==='U'){ok=/H$/i.test(club);label='U（混合桿）'}
  else if(L==='S'){ok=/°$/.test(club);label='S（挖起桿）'}
  return ok?null:{code:label,want:want&&S.clubs.includes(want)?want:null};
}
async function camRecord(r,shotNo){
  const m={};for(const k of RG_EXTRA){const v=await camRead(k,true);if(v!=null)m[k]=v}
  let code=null;try{code=await camRead('club',true)}catch(e){}
  const now=Date.now(),id=now.toString(36)+Math.random().toString(36).slice(2,6);
  const shot={id,t:now,club:S.sel.club,swing:S.sel.swing,face:S.sel.face,open:S.sel.face==='open',carry:r.carry,roll:r.roll,src:'cam',m};
  if(code)shot.rg=code;
  D.shots[id]=shot;rebuild();changed();
  CAM.recent.unshift(id);CAM.recent=CAM.recent.slice(0,20);
  CAM.lastRec=camSig(r);CAM.lastTotal=r.total;if(shotNo!=null)CAM.base=shotNo;CAM.state='idle';CAM.pend=null;CAM.pendN=0;
  CAM.mismatch=rgClubCheck(code,shot.club);if(CAM.mismatch)CAM.mismatch.id=id;
  beep(880);camStatus(`已記錄${shotNo!=null?'第 '+shotNo+' 球':''}・等待擊球…`,'ok');camWarn('');
  render();camPanel();
}
function beep(f){try{const a=CAM.audio||(CAM.audio=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();
  o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch(e){}}

async function camLoop(){
  clearTimeout(CAM.timer);if(!CAM.open)return;
  if(CAM.running&&!CAM.busy&&CAM.worker){CAM.busy=true;try{await camStep()}catch(e){console.error(e)}CAM.busy=false}
  CAM.timer=setTimeout(camLoop,300);
}

/* --- overlay drawing & calibration handles --- */
function camVideoBox(){const v=camEl('cam-video'),st=camEl('cam-stage');const W=st.clientWidth,H=st.clientHeight,vw=v.videoWidth||16,vh=v.videoHeight||9;
  const s=Math.min(W/vw,H/vh);return{x:(W-vw*s)/2,y:(H-vh*s)/2,w:vw*s,h:vh*s,W,H}}
function camDraw(){
  if(!CAM.open)return;CAM.raf=requestAnimationFrame(camDraw);
  const cv=camEl('cam-ov'),b=camVideoBox(),dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(b.W*dpr)||cv.height!==Math.round(b.H*dpr)){cv.width=Math.round(b.W*dpr);cv.height=Math.round(b.H*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,b.W,b.H);
  const P=p=>[b.x+p[0]*b.w,b.y+p[1]*b.h];
  g.lineWidth=2;g.strokeStyle=CAM.calib?'#F0C23A':'rgba(240,194,58,.7)';g.beginPath();CAM.quad.forEach((p,i)=>{const[x,y]=P(p);i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();g.stroke();
  g.font='600 12px system-ui,sans-serif';
  for(const k in RG_FIELDS){const[x0,y0,x1,y1]=camFieldRect(k),[a,c]=P([x0,y0]),[e,f]=P([x1,y1]);
    const key=RG_KEY.includes(k);g.strokeStyle=key?'rgba(79,163,116,.95)':'rgba(255,255,255,.55)';g.lineWidth=key?2:1;g.strokeRect(a,c,e-a,f-c);
    if(CAM.calib){const v=CAM.vals[k];const txt=(v==null?'?':v)+'';g.fillStyle='rgba(0,0,0,.65)';const tw=g.measureText(txt).width+8;g.fillRect(e-tw,f,tw,16);g.fillStyle=v==null?'#F2786D':'#fff';g.fillText(txt,e-tw+4,f+12)}}
  if(CAM.calib){CAM.quad.forEach((p,i)=>{const[x,y]=P(p);g.fillStyle='#F0C23A';g.beginPath();g.arc(x,y,13,0,7);g.fill();g.fillStyle='#241A00';g.font='700 12px system-ui';g.fillText(['左上','右上','右下','左下'][i],x-12,y+4)})}
}
function camPointer(e){
  if(!CAM.calib)return;const b=camVideoBox(),r=camEl('cam-ov').getBoundingClientRect();
  const px=e.clientX-r.left,py=e.clientY-r.top;
  if(e.type==='pointerdown'){let best=-1,bd=40;CAM.quad.forEach((p,i)=>{const d=Math.hypot(b.x+p[0]*b.w-px,b.y+p[1]*b.h-py);if(d<bd){bd=d;best=i}});
    CAM.drag=best;if(best>=0){e.preventDefault();camEl('cam-ov').setPointerCapture(e.pointerId)}return}
  if(CAM.drag<0)return;e.preventDefault();
  if(e.type==='pointermove'){CAM.quad[CAM.drag]=[Math.min(1,Math.max(0,(px-b.x)/b.w)),Math.min(1,Math.max(0,(py-b.y)/b.h))];CAM.hash={}}
  else{CAM.drag=-1;camSaveQuad()}
}

/* --- panel (clubs, swing, recent shots) --- */
const r1=v=>(Math.round(toDisp(v)*10)/10).toFixed(1);
function camLive(){const el=camEl('cam-live');if(!el)return;const v=CAM.vals,f=x=>x==null?'—':x;
  el.textContent=CAM.running?`畫面讀到：總距離 ${f(v.total)}・落點 ${f(v.carry)}・滾動 ${f(v.roll)}・擊球數 ${f(v.shots)}`:''}
function camPanel(){
  if(!CAM.open)return;
  camEl('cam-clubs').innerHTML=S.clubs.map(c=>`<button class="chip" data-camclub="${esc(c)}" aria-pressed="${c===S.sel.club}">${esc(c)}</button>`).join('');

  const shots=CAM.recent.map(id=>D.shots[id]).filter(Boolean).slice(0,5);
  camEl('cam-recent').innerHTML=shots.length?shots.map(s=>`<li><span class="cr-c">${esc(s.club)}</span><span class="cr-s">${swName(s.swing)}${faceTag(faceOf(s))}</span>
    <span class="cr-n">${r1(s.carry)} <small>+${r1(s.roll)}</small> = <b>${r1(s.carry+s.roll)}</b></span></li>`).join('')
    :`<li class="cr-empty">${CAM.running?'打完一球、數字停住後會自動記錄在這裡。':'選好球桿後按「開始自動記錄」。'}</li>`;
  camEl('cam-undo').disabled=!shots.length;
  const run=camEl('cam-run');run.textContent=CAM.running?'暫停':'開始自動記錄';run.className='btn'+(CAM.running?' ghost':'');run.disabled=CAM.calib;
  camEl('cam-calib').textContent=CAM.calib?'完成校正':'校正';
  camEl('cam-calibbar').hidden=!CAM.calib;
  const mm=CAM.mismatch;
  if(mm&&D.shots[mm.id])camWarn(`畫面球桿是 <b>${esc(mm.code)}</b>，App 選的是 <b>${esc(D.shots[mm.id].club)}</b>。
    ${mm.want?`<button class="btn" data-camfix="${esc(mm.want)}">上一球改成 ${esc(mm.want)}</button>`:'請在上方選好正確球桿，再按'}
    ${mm.want?'':`<button class="btn" data-camfix="">套用到上一球</button>`}<button class="btn ghost" data-camfix="-">忽略</button>`);
}
async function camStart(){
  try{CAM.audio=CAM.audio||new (window.AudioContext||window.webkitAudioContext)();CAM.audio.resume()}catch(e){}
  try{if(navigator.wakeLock&&!CAM.wake)CAM.wake=await navigator.wakeLock.request('screen')}catch(e){}
  CAM.running=true;CAM.started=false;CAM.base=null;CAM.lastTotal=null;CAM.lastRec=null;CAM.state='idle';CAM.pend=null;CAM.pendN=0;CAM.lastOk=Date.now();CAM.hash={};camPanel();
  try{await camWorker();camStatus('尋找擊球數…')}catch(e){CAM.running=false;camStatus('辨識引擎載入失敗，請確認網路後再試一次','bad');camPanel()}
}
async function camStream(){
  const v=camEl('cam-video');
  CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
  v.srcObject=CAM.stream;await v.play().catch(()=>{});
}
async function camOpen(){
  CAM.open=true;CAM.quad=camLoadQuad();CAM.calib=!localStorage.getItem(LS_QUAD);CAM.vals={};CAM.hash={};CAM.mismatch=null;
  camEl('cam').hidden=false;document.body.classList.add('cam-on');camPanel();camWarn('');
  camStatus(CAM.calib?'第一次使用：請先校正位置':'按「開始自動記錄」');
  try{await camStream()}catch(e){camStatus('無法開啟相機。請在瀏覽器設定允許此網站使用相機。','bad');return}
  camDraw();camLoop();camWorker().then(()=>{if(!CAM.running)camStatus(CAM.calib?'拖曳四個圓點對準數據欄，再按「測試讀取」':'按「開始自動記錄」')}).catch(()=>camStatus('辨識引擎載入失敗，請確認網路','bad'));
}
function camClose(){
  CAM.open=false;CAM.running=false;CAM.calib=false;clearTimeout(CAM.timer);cancelAnimationFrame(CAM.raf);
  if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;
  try{CAM.wake&&CAM.wake.release()}catch(e){}CAM.wake=null;
  camEl('cam').hidden=true;document.body.classList.remove('cam-on');render();
}
async function camTest(){
  if(!CAM.worker){toast('辨識引擎還在載入');return}
  if(CAM.busy){setTimeout(camTest,200);return}
  CAM.busy=true;camStatus('讀取中…');
  try{if(camGrab())for(const k in RG_FIELDS)await camRead(k,true);
    const miss=RG_KEY.filter(k=>CAM.vals[k]==null).map(k=>RG_LABEL[k]);
    const r={total:CAM.vals.total,carry:CAM.vals.carry,roll:CAM.vals.roll};
    camStatus(miss.length?`讀不到：${miss.join('、')}，請調整圓點位置`:camValid(r)?'讀取正確，可以按「完成校正」':'數字對不上（落點＋滾動≠總距離），請微調位置',miss.length||!camValid(r)?'bad':'ok');
  }catch(e){camStatus('讀取失敗','bad')}
  CAM.busy=false;
}
document.addEventListener('visibilitychange',()=>{if(CAM.open&&document.visibilityState==='visible'){const v=camEl('cam-video');
  if(!CAM.stream||CAM.stream.getVideoTracks().every(t=>t.readyState==='ended'))camStream().catch(()=>{});else v.play().catch(()=>{})}});
function camInit(){
  const ov=camEl('cam-ov');['pointerdown','pointermove','pointerup','pointercancel'].forEach(t=>ov.addEventListener(t,camPointer));
  camEl('cam').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(b.id==='cam-close'){camClose();return}
    if(b.id==='cam-calib'){CAM.calib=!CAM.calib;if(CAM.calib)CAM.running=false;else{camSaveQuad();camStatus('按「開始自動記錄」')}camPanel();return}
    if(b.id==='cam-test'){camTest();return}
    if(b.id==='cam-reset'){CAM.quad=camQuadDefault();CAM.hash={};return}
    if(b.id==='cam-run'){if(CAM.running){CAM.running=false;camStatus('已暫停');camPanel()}else camStart();return}
    if(b.id==='cam-undo'){const id=CAM.recent.shift();if(id&&D.shots[id]){deleteShot(id);toast('已撤銷上一球')}if(CAM.mismatch&&CAM.mismatch.id===id)CAM.mismatch=null,camWarn('');camPanel();return}
    if(d.camclub!==undefined){S.sel.club=d.camclub;fixSel();render();camPanel();return}
    if(d.camfix!==undefined){const mm=CAM.mismatch;CAM.mismatch=null;camWarn('');
      if(mm&&d.camfix!=='-'&&D.shots[mm.id]){if(d.camfix){S.sel.club=d.camfix;fixSel()}
        D.shots[mm.id]=Object.assign({},D.shots[mm.id],{club:S.sel.club,swing:S.sel.swing,face:S.sel.face,open:S.sel.face==='open',u:Date.now()});rebuild();changed();toast(`上一球已改成 ${S.sel.club}`)}
      render();camPanel();return}
  });
  camEl('cam-swing').addEventListener('change',e=>{S.sel.swing=e.target.value;render()});
  camEl('cam-face').addEventListener('change',e=>{S.sel.face=e.target.value;render()});

  app.innerHTML=S.mode==='loading'?'<p class="sub">載入中…</p>':S.view==='log'?viewLog():S.view==='table'?viewTable():S.view==='pick'?viewPick():viewSet();

  if(d.notes!==undefined){S.notes={open:true,club:d.notes||'all',edit:null};S.armed=null;render();const sc=document.querySelector('#sheet .notes-full');if(sc)sc.scrollTop=0;return}
  if(d.nclub){S.notes.club=d.nclub;S.notes.edit=null;S.armed=null;render();return}
  if(d.nedit){S.notes.edit=d.nedit;S.armed=null;render();const t=document.getElementById('nedit-in');if(t)t.focus();return}
  if(d.ncancel){S.notes.edit=null;S.armed=null;render();return}
  if(d.ndel){if(S.armed==='n'+d.ndel){setNotes(d.nclubdel,notesFor(d.nclubdel).filter(x=>x.id!==d.ndel));S.notes.edit=null;S.armed=null;toast('已刪除');render()}else{S.armed='n'+d.ndel;render()}return}
  if(b.id==='open-cam'){camOpen();return}
  if(b.id==='open-all'){S.all.open=true;S.all.edit=null;S.armed=null;render();return}
  if(d.allf){S.all.filter=d.allf;S.all.edit=null;S.armed=null;render();const sc=document.querySelector('#sheet .sheet');if(sc)sc.scrollTop=0;return}
  if(d.edit){S.all.edit=d.edit;S.armed=null;render();return}
  if(d.edcancel){S.all.edit=null;S.armed=null;render();return}
  if(d.club!==undefined){S.sel.club=d.club;fixSel();S.armed=null;render();return}
  if(d.swing){S.sel.swing=d.swing;S.armed=null;render();return}
  if(b.id==='open-t'){S.sel.face=S.sel.face==='open'?'square':'open';render();return}
  if(d.sface){S.sel.face=d.sface;render();return}
  if(d.pctreset){const m=Object.assign({},S.pctMap);delete m[d.pctreset];S.pctMap=m;fixSel();persistSettings();render();toast(`${d.pctreset} 已改回預設`);return}
  if(d.rec){S.recency=Object.assign({},S.recency,d.rec==='off'?{on:false}:{on:true,by:d.rec});persistSettings();render();return}
  if(d.half){const v=+d.half;S.recency=Object.assign({},S.recency,S.recency.by==='time'?{days:v}:{half:v});persistSettings();render();return}
  if(d.stat){S.statMode=d.stat;persistSettings();render();return}
  if(b.id==='save'){doSave();return}
  if(b.id==='sync-now'){doSync();return}
  if(b.id==='sync-off'){if(S.armed==='sync-off'){sync.token='';sync.gistId='';sync.status='off';saveCfg();S.armed=null;toast('已中斷這台裝置的同步')}else S.armed='sync-off';render();return}
  if(d.del){if(S.armed===d.del)deleteShot(d.del);else{S.armed=d.del;render()}return}
  if(d.face){S.face=d.face;render();return}
  if(d.bias){S.pick.bias=d.bias;try{localStorage.setItem('yardbook-gh-bias',d.bias)}catch(e){}render();return}
  if(d.cell){S.detail=d.cell.split('|');S.armed=null;render();return}
  if(d.unit){S.unit=d.unit;persistSettings();render();return}
  if(d.up!==undefined){const i=+d.up,a=S.clubs.slice();[a[i-1],a[i]]=[a[i],a[i-1]];S.clubs=a;persistSettings();render();return}
  if(d.down!==undefined){const i=+d.down,a=S.clubs.slice();[a[i+1],a[i]]=[a[i],a[i+1]];S.clubs=a;persistSettings();render();return}
  if(d.rm!==undefined){S.clubs=S.clubs.filter((_,i)=>i!==+d.rm);fixSel();persistSettings();render();return}
  if(b.id==='export'){
    const rows=[['日期時間','球桿','揮桿','桿面','carry('+U()+')','滾動('+U()+')','總距離('+U()+')','桿頭速度(mph)','球速(mph)','擊球效率','起飛角度','倒旋(rpm)','側旋(rpm)','來源']]
      .concat(allShots().reverse().map(s=>{const t=new Date(s.t);return[`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`,s.club,swName(s.swing),FACES[faceOf(s)],r0(s.carry),r0(s.roll),r0(s.carry+s.roll)].concat(['cs','bs','sf','la','bsp','ssp'].map(k=>s.m&&s.m[k]!=null?s.m[k]:''),[s.src==='cam'?'鏡頭':'手動'])}));
    const csv=rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?`"${String(x).replace(/"/g,'""')}"`:x).join(',')).join('\n');
    const ta=document.getElementById('csv');ta.value=csv;
    const fallback=()=>{ta.hidden=false;ta.focus();ta.select();toast('請長按選取文字後複製')};
    try{navigator.clipboard.writeText(csv).then(()=>toast(`已複製 ${rows.length-1} 球紀錄`),fallback)}catch(err){fallback()}
  }
});
camInit();
init();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
