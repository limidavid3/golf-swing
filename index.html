<style>
/* Layout: one-column yardage-book app, entry pad on top, fixed tab bar at the bottom */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --ink:#E4ECE6; --muted:#93A198; --line:#29372E;
  --green:#4FA374; --on-green:#0B130E; --green-soft:#1D2D23;
  --flag:#F0C23A; --on-flag:#241A00; --danger:#F2786D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --ink:#E4ECE6; --muted:#93A198; --line:#29372E;
  --green:#4FA374; --on-green:#0B130E; --green-soft:#1D2D23;
  --flag:#F0C23A; --on-flag:#241A00; --danger:#F2786D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  margin:0;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.badge{font-family:var(--num);font-size:15px;font-weight:600;background:var(--green-soft);color:var(--green);padding:2px 10px;border-radius:99px;white-space:nowrap}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;font-weight:500}

button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-family:var(--num);font-size:20px;font-weight:600;text-align:center;min-width:0}
.pctgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip.pct{font-size:18px;padding:8px 0}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.two{grid-template-columns:1fr 1fr}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;padding:11px 4px;font-size:14px;font-weight:500;border-left:1px solid var(--line)}

.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--flag)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}

li.odd .n{opacity:.45;text-decoration:line-through}

.edgrid.one{grid-template-columns:1fr;margin-top:8px}
.pk-mode{font-size:12.5px;color:var(--muted);margin:0}

.picks li.pk{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}

.pk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}

.ck{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--green-soft);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}

.pk-val small{font-size:11px;color:var(--muted)}
.pk-val b{font-family:var(--num);font-size:28px;font-weight:700}
.pk-val small.near{color:var(--green);font-weight:700;font-size:13px}
.fold{padding:0}
.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;font-weight:500}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary>span:first-child{flex:1}
.sumv{font-size:13px;color:var(--muted);font-weight:400}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .15s}
.fold[open]>summary .chev{transform:rotate(-135deg);margin:4px 4px 0 2px}
.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.fold-body .note{margin:0}
.pctlist{display:flex;flex-direction:column;gap:8px}
.pctform{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center}
.pctform.def{padding-top:8px;border-top:1px dashed var(--line)}
.pctform input{min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.pctname{font-family:var(--num);font-size:20px;font-weight:600;display:flex;flex-direction:column;line-height:1.1}
.pctname small{font-family:var(--body);font-size:10.5px;font-weight:400;color:var(--muted)}
.mini.wide{grid-column:2/4;width:auto;height:auto;padding:4px 10px;font-size:12.5px;justify-self:start;color:var(--muted)}
.notestrip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;border:1px dashed var(--flag);background:var(--surface);text-align:left;min-width:0}
.ns-k{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--on-flag);background:var(--flag);padding:1px 8px;border-radius:6px}
.ns-t{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pk-note{border:0;background:transparent;padding:0;text-align:left;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.notes-full{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.notes-full>*{flex-shrink:0;width:100%;max-width:560px;margin-inline:auto}
.nhead h2{font-size:20px}

.nlist li{border-top:1px solid var(--line)}

.nitem{border:0;background:transparent;width:100%;text-align:left;padding:10px 4px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.nform{display:flex;flex-direction:column;gap:8px;padding:8px 0}

  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

<body>

<div class="wrap" id="app"><p class="sub">載入中…</p></div>
<nav class="tabs" role="tablist" id="tabs">
  <button id="tab-log" role="tab" data-view="log">記錄</button>
  <button id="tab-table" role="tab" data-view="table">距離表</button>
  <button id="tab-pick" role="tab" data-view="pick">選桿</button>
  <button id="tab-set" role="tab" data-view="set">設定</button>
</nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
const SWINGS=[{k:'power',n:'出力全揮'},{k:'full',n:'正常全揮'},{k:'three',n:'3/4 揮'},{k:'half',n:'半揮'}];
const SW=Object.fromEntries(SWINGS.map(s=>[s.k,s.n]));
const isWedge=c=>{c=String(c).trim();return /°$/.test(c)||/^(PW|P|AW|GW|SW|LW)$/i.test(c)};
const FACES={square:'標準',open:'開桿面',closed:'關桿面'};
const faceOf=s=>s.face||(s.open===true?'open':'square');
const facesFor=c=>isWedge(c)?['open','square','closed']:['square'];
const faceTag=f=>!f||f==='square'?'':'・'+FACES[f];
function legacyKeys(clubs){const set=new Set(allShots().filter(s=>clubs.includes(s.club)&&!s.swing.startsWith('pct')).map(s=>s.swing));return SWINGS.map(x=>x.k).filter(k=>set.has(k))}
const swName=k=>k.startsWith('pct')?k.slice(3)+'%':(SW[k]||k);
const pctsFor=c=>(S.pctMap&&S.pctMap[c])||S.pcts;
// % swing keys for one club (its own list) or, with no club, the union across all wedge-type clubs (distance table columns).
function wedgeKeys(extraFromData,club){
  const base=club?pctsFor(club):[...new Set([S.pcts].concat(clubOrder().filter(isWedge).map(pctsFor)).flat())];
  const keys=base.map(p=>'pct'+p);
  if(extraFromData){for(const s of allShots())if(s.swing.startsWith('pct')&&(!club||s.club===club)&&!keys.includes(s.swing))keys.push(s.swing)}
  return keys.sort((a,b)=>+b.slice(3)-+a.slice(3));
}
function swingsFor(club){return isWedge(club)?wedgeKeys(false,club).map(k=>({k,n:swName(k)})):SWINGS}
const NEW_WOODS=['1W','3W','3H','4H'];
const DEFAULT_PCTS=[100,90,80,70,60,50,40,30,20,10];
const DEFAULT_CLUBS=['1W','3W','3H','4H','5i','6i','7i','8i','9i','PW','48°','54°','58°'];
const LS_KEY='yardbook-v1';
const YD_PER_M=1.0936;

const S={clubs:DEFAULT_CLUBS.slice(),unit:'yd',pcts:DEFAULT_PCTS.slice(),sessions:{},view:'log',face:'square',
  statMode:'mad',pctMap:{},openSec:{},sel:{club:'7i',swing:'full',face:'square'},pick:{carry:'',total:'',bias:(()=>{try{return localStorage.getItem('yardbook-gh-bias')||'long'}catch(e){return'long'}})()},notes:{open:false,club:'all',edit:null},all:{open:false,filter:'all',edit:null},mode:'loading',armed:null,detail:null};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayId=d=>`s-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const toDisp=yd=>S.unit==='m'?yd/YD_PER_M:yd;
const fromIn=v=>S.unit==='m'?v*YD_PER_M:v;
const r0=v=>Math.round(toDisp(v));
const U=()=>S.unit==='m'?'公尺':'碼';

/* ---------- storage: this device first, synced through a private GitHub Gist ---------- */
const LS_DATA='yardbook-gh-data', LS_CFG='yardbook-gh-sync', GIST_FILE='yardbook-data.json', GH='https://api.github.com';
let D={shots:{},deleted:{},settings:null,notes:{}};
const sync={token:'',gistId:'',last:0,rev:0,busy:false,status:'off',timer:null};
function loadCfg(){try{const v=JSON.parse(localStorage.getItem(LS_CFG)||'{}');sync.token=v.token||'';sync.gistId=v.gistId||'';sync.last=v.last||0}catch(e){}}
function saveCfg(){try{localStorage.setItem(LS_CFG,JSON.stringify({token:sync.token,gistId:sync.gistId,last:sync.last}))}catch(e){}}
function saveLocalData(){try{localStorage.setItem(LS_DATA,JSON.stringify(D))}catch(e){toast('手機儲存空間不足，請先匯出備份')}}
function applySettings(st){if(!st)return;S.clubs=(st.clubs||DEFAULT_CLUBS).slice();S.unit=st.unit||'yd';S.pcts=(st.pcts||DEFAULT_PCTS).slice();S.pctMap=Object.assign({},st.pctMap||{});S.statMode=st.statMode||'mad';fixSel()}
function rebuild(){const ss={};for(const id in D.shots){if(D.deleted[id])continue;const s=D.shots[id];const k=dayId(new Date(s.t));(ss[k]=ss[k]||{shots:[]}).shots.push(s)}S.sessions=ss}
function changed(){saveLocalData();sync.rev++;scheduleSync(2000)}
function persistSettings(){D.settings={clubs:S.clubs.slice(),unit:S.unit,pcts:S.pcts.slice(),pctMap:Object.assign({},S.pctMap),statMode:S.statMode,updated:Date.now()};changed()}
function loadLocal(){
  try{const v=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(v)D={shots:v.shots||{},deleted:v.deleted||{},settings:v.settings||null,notes:v.notes||{}}}catch(e){}
  if(D.settings)applySettings(D.settings);
  rebuild();
}
function merge(a,b){
  const out={shots:Object.assign({},a.shots),deleted:Object.assign({},a.deleted,b.deleted),settings:null};
  for(const id in b.shots){const x=b.shots[id],y=out.shots[id];if(!y||(x.u||x.t)>=(y.u||y.t))out.shots[id]=x}
  for(const id in out.deleted)delete out.shots[id];
  const sa=a.settings,sb=b.settings;out.settings=!sa?sb||null:!sb?sa:(sb.updated>sa.updated?sb:sa);
  out.notes=Object.assign({},a.notes||{});for(const c in (b.notes||{})){const x=b.notes[c],y=out.notes[c];if(!y||x.updated>=y.updated)out.notes[c]=x}
  return out;
}
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const sig=x=>canon({shots:x.shots||{},deleted:x.deleted||{},settings:x.settings||null,notes:x.notes||{}});
async function gh(path,opt={}){
  const headers={'Authorization':'Bearer '+sync.token,'Accept':'application/vnd.github+json'};
  if(opt.body)headers['Content-Type']='application/json';
  const r=await fetch(GH+path,Object.assign({},opt,{headers,cache:'no-store'}));
  if(r.status===401||r.status===403)throw new Error('auth');
  if(r.status===404)throw new Error('missing');
  if(!r.ok)throw new Error('http');
  return r.json();
}
async function findGist(){
  for(let page=1;page<=10;page++){const list=await gh(`/gists?per_page=100&page=${page}`);
    const g=list.find(x=>x.files&&x.files[GIST_FILE]);if(g)return g.id;if(list.length<100)break}
  return '';
}
async function readGist(){
  const g=await gh('/gists/'+sync.gistId);const f=g.files&&g.files[GIST_FILE];
  if(!f)return{shots:{},deleted:{},settings:null,notes:{}};
  let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});txt=await r.text()}
  try{const v=JSON.parse(txt);return{shots:v.shots||{},deleted:v.deleted||{},settings:v.settings||null,notes:v.notes||{}}}catch(e){return{shots:{},deleted:{},settings:null,notes:{}}}
}
function scheduleSync(ms){if(!sync.token)return;clearTimeout(sync.timer);sync.timer=setTimeout(doSync,ms)}
async function doSync(){
  if(!sync.token)return;
  if(sync.busy){scheduleSync(1500);return}
  if(!navigator.onLine){sync.status='offline';renderSync();return}
  sync.busy=true;sync.status='syncing';renderSync();
  const revAtStart=sync.rev;
  try{
    if(!sync.gistId){sync.gistId=await findGist();saveCfg()}
    if(!sync.gistId){
      const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'練球碼數本 同步資料（請勿刪除）',public:false,files:{[GIST_FILE]:{content:JSON.stringify(D)}}})});
      sync.gistId=g.id;
    }else{
      let remote;
      try{remote=await readGist()}catch(e){if(e.message==='missing'){sync.gistId='';saveCfg();throw new Error('retry')}throw e}
      const before=sig(D), m=merge(remote,D), after=sig(m);
      D=m;saveLocalData();
      if(after!==before){if(D.settings)applySettings(D.settings);rebuild();render()}
      if(after!==sig(remote))await gh('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(m)}}})});
    }
    sync.last=Date.now();sync.status='ok';
  }catch(e){sync.status=e.message==='auth'?'auth':'error';if(e.message==='retry')scheduleSync(500)}
  finally{
    sync.busy=false;saveCfg();
    if(sync.rev!==revAtStart&&sync.status==='ok')scheduleSync(800);
    renderSync();
  }
}
function syncText(){
  const ago=sync.last?fmtDate(sync.last):'';
  if(!sync.token)return['warn','尚未設定同步，紀錄只存在這台裝置。到「設定」連結 GitHub 後，所有裝置都能看到同一份紀錄。'];
  if(sync.status==='syncing')return['','同步中…'];
  if(sync.status==='offline')return['warn','目前離線，紀錄先存在這台裝置，有網路時會自動同步。'];
  if(sync.status==='auth')return['warn','GitHub 金鑰無效或已過期，請到「設定」重新貼上。'];
  if(sync.status==='error')return['warn','同步失敗，紀錄已存在這台裝置，稍後會再試。'];
  return['',`已同步${ago?'（'+ago+'）':''}`];
}
function renderSync(){const el=document.getElementById('syncline');if(el){const[c,t]=syncText();el.className='status '+c;el.textContent=t}
  const st=document.getElementById('sync-state');if(st)st.textContent=syncText()[1];}
function init(){
  loadCfg();loadLocal();S.mode='gh';fixSel();render();
  if(sync.token)doSync();
  window.addEventListener('online',()=>scheduleSync(300));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(300)});
}
function migrate(){S.clubs=NEW_WOODS.filter(c=>!S.clubs.includes(c)).concat(S.clubs);S.pcts=DEFAULT_PCTS.slice()}
function fixSel(){if(!S.clubs.includes(S.sel.club))S.sel.club=S.clubs[0]||'';const ks=swingsFor(S.sel.club).map(x=>x.k);if(!ks.includes(S.sel.swing))S.sel.swing=isWedge(S.sel.club)?ks[0]:'full';if(!facesFor(S.sel.club).includes(S.sel.face))S.sel.face='square'}

/* ---------- data helpers ---------- */
function allShots(){const out=[];for(const id in S.sessions)for(const s of S.sessions[id].shots)out.push(s);return out.sort((a,b)=>b.t-a.t)}
const median=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
// MAD outlier screen on carry (see 設定 → 距離統計方式). Short misses are flagged sooner than long ones.
function splitOutliers(shots){
  if(S.statMode==='mean'||shots.length<6)return{used:shots,out:[]};
  const cs=shots.map(s=>s.carry),med=median(cs);
  const sig=Math.max(2,1.4826*median(cs.map(c=>Math.abs(c-med))));
  const used=[],out=[];
  for(const s of shots){const d=s.carry-med;(d<-2.5*sig||d>3*sig?out:used).push(s)}
  return{used,out};
}
function statsFor(shots){
  const n=shots.length;if(!n)return{n:0,used:0,out:0,carry:null,total:null,min:null,max:null,sd:null};
  const{used,out}=splitOutliers(shots),cs=used.map(s=>s.carry),ts=used.map(s=>s.carry+s.roll);
  const useMed=S.statMode!=='mean'&&n>=3&&n<=5;
  return{n,used:used.length,out:out.length,carry:useMed?median(cs):mean(cs),total:useMed?median(ts):mean(ts),
    min:Math.min(...cs),max:Math.max(...cs),sd:used.length>=3?sdOf(cs):null};
}
let OUT=new Set();
function computeOutliers(){const g={};for(const s of allShots()){const k=s.club+'|'+s.swing+'|'+faceOf(s);(g[k]=g[k]||[]).push(s)}
  const set=new Set();for(const k in g)for(const s of splitOutliers(g[k]).out)set.add(s.id);return set}
function match(club,swing,face){return allShots().filter(s=>s.club===club&&s.swing===swing&&faceOf(s)===face)}

/* ---------- club picker ---------- */
// Starting estimates (total yards, normal full swing) used only until a combo has its own shots.
const EST={'1W':230,'3W':210,'3H':190,'4H':180,'5i':165,'6i':155,'7i':145,'8i':135,'9i':125,'PW':115,'48°':107,'54°':92,'58°':78};
const ROLL_SHARE=c=>/W$/.test(c)?0.12:/H$/.test(c)?0.08:isWedge(c)?0.03:0.06;
function sdOf(a){if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))}
// Every club + swing + face you have shots for, plus starting estimates for full swings with no shots yet.
function candidates(){
  const out=[];
  for(const club of clubOrder()){
    const keys=isWedge(club)?wedgeKeys(true,club).concat(legacyKeys([club])):SWINGS.map(x=>x.k);
    for(const k of keys)for(const face of facesFor(club)){
      const st=statsFor(match(club,k,face));
      if(st.n){
        const sd=Math.max(3,st.sd==null?Math.max(4,0.05*st.carry):st.sd);
        out.push({club,swing:k,face,carry:st.carry,total:st.total,roll:st.total-st.carry,n:st.n,sd,low:st.carry-sd,est:false});
      }else if(face==='square'&&(k==='full'||k==='pct100')&&EST[club]&&S.clubs.includes(club)){
        const t=EST[club],c=t*(1-ROLL_SHARE(club)),sd=Math.max(4,0.06*c);
        out.push({club,swing:k,face,carry:c,total:t,roll:t-c,n:0,sd,low:c-sd,est:true});
      }
    }
  }
  return out;
}
// Approach-shot logic (see 設定 → 選桿邏輯).
const SWING_PEN={full:0,three:3,half:4,power:8};
function recommend(C,T){
  const longFirst=S.pick.bias!=='short';
  const w=d=>d<0?(longFirst?1.5:1)*-d:(longFirst?1:1.5)*d;   // short/long miss weighting
  const room=C!=null&&T!=null?T-C:null;                       // roll space between carry point and target
  const list=candidates().map(c=>{
    const metric=T!=null?c.total:c.carry, pass=C==null||c.low>=C;
    let pen=(isWedge(c.club)?0:(SWING_PEN[c.swing]||0))+c.sd*0.3+(c.est?5:c.n<3?2:0)+(c.face!=='square'?3:0);
    const rollOver=room!=null&&c.roll-room>3;if(rollOver)pen+=(c.roll-room)*0.5;
    return Object.assign({},c,{pass,rollOver,metric,score:w(metric-(T!=null?T:C))+pen});
  });
  list.sort((a,b)=>(b.pass-a.pass)||(a.score-b.score));
  return list.length?{list:list.slice(0,5),C,T,room}:null;
}
function pickCard(c,i,res){
  const dv=Math.round(toDisp(c.metric-(res.T!=null?res.T:res.C)));
  const chips=[];
  if(res.C!=null)chips.push(c.pass?`<span class="ck ok">飛過 ✓ 餘 ${Math.round(toDisp(c.low-res.C))}</span>`:`<span class="ck bad">⚠ 可能飛不過</span>`);
  if(res.room!=null)chips.push(c.rollOver?`<span class="ck bad">⚠ 滾過頭 ${r0(c.roll)}</span>`:`<span class="ck">滾 ${r0(c.roll)}</span>`);
  chips.push(`<span class="ck">±${Math.round(toDisp(c.sd))}</span>`);
  chips.push(c.est?`<span class="ck mute">預估</span>`:`<span class="ck">${c.n}球</span>`);
  return `<li class="pk ${i===0?'best':''}"><span class="pk-rank">${i+1}</span>
    <div class="pk-body"><div class="pk-top"><span class="pk-club">${esc(c.club)}</span><span class="pk-sw">${swName(c.swing)}${faceTag(c.face)}</span></div>
      <div class="pk-chips">${chips.join('')}</div>${notesFor(c.club).length?`<button class="pk-note" data-notes="${esc(c.club)}">注意：${esc(notesFor(c.club)[0].text)}${notesFor(c.club).length>1?`（共 ${notesFor(c.club).length} 項）`:''}</button>`:''}</div>
    <div class="pk-val"><small>${res.T!=null?'總距離':'carry'}</small><b>${r0(c.metric)}</b><small class="${Math.abs(dv)<=3?'near':''}">${dv===0?'剛好':dv>0?'+'+dv:dv}</small></div></li>`;
}
function viewPickResults(){
  const tc=num(S.pick.carry),tt=num(S.pick.total);
  if(tc==null&&tt==null)return `<p class="empty">輸入目標距離後，這裡會依攻果嶺邏輯排出前 5 個選擇。</p>`;
  const res=recommend(tc!=null?fromIn(tc):null,tt!=null?fromIn(tt):null);
  if(!res)return `<p class="empty">還沒有可以比對的紀錄。</p>`;
  const mode=tc!=null&&tt!=null?'飛過＋停在目標':tc!=null?'必須飛過':'一般攻果嶺';
  return `<p class="pk-mode"><b>${mode}</b>・${S.pick.bias==='short'?'寧短勿長':'寧長勿短'}・排序：${tc!=null?'能否飛過 → ':''}距離誤差 → 揮法與穩定度</p>
  <ol class="picks">${res.list.map((c,i)=>pickCard(c,i,res)).join('')}</ol>`;
}
function viewPick(){
  return `<header><div><h1>選桿</h1><div class="sub">輸入目標距離，用攻果嶺邏輯推薦球桿</div></div></header>
  <section class="entry two">
    <div class="field"><label for="pk-carry">必須飛過（carry，${U()}）</label><input id="pk-carry" inputmode="decimal" autocomplete="off" placeholder="選填" value="${esc(S.pick.carry)}"></div>
    <div class="field"><label for="pk-total">目標總距離（${U()}）</label><input id="pk-total" inputmode="decimal" autocomplete="off" placeholder="選填" value="${esc(S.pick.total)}"></div>
  </section>
  <div class="seg two"><button data-bias="long" aria-pressed="${S.pick.bias!=='short'}">寧長勿短</button><button data-bias="short" aria-pressed="${S.pick.bias==='short'}">寧短勿長</button></div>
  <p class="note">果嶺前方有沙坑或水池選「寧長勿短」；果嶺後方是 OB、下坡或障礙時選「寧短勿長」。詳細判斷方式在「設定」最下方。</p>

function viewTable(){
  const clubs=clubOrder(), face=S.face;
  const tbl=(list,cols,cap)=>list.length?`<div class="label">${cap}</div><div class="tablebox"><table style="min-width:${Math.max(420,70+cols.length*64)}px"><thead><tr><th></th>${cols.map(s=>`<th scope="col">${s.n}</th>`).join('')}</tr></thead><tbody>${list.map(c=>`<tr><th scope="row">${esc(c)}</th>${cols.map(s=>{
    const st=statsFor(match(c,s.k,face));
    return `<td><button data-cell="${esc(c)}|${s.k}">${st.n?`<span class="c">${r0(st.total)}</span><span class="t">carry ${r0(st.carry)}</span><span class="t">${st.n}球${st.out?`・排除${st.out}`:''}</span>`:'<span class="none">—</span>'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  const irons=clubs.filter(c=>!isWedge(c)), wedges=clubs.filter(isWedge);
  const wcols=wedgeKeys(true).map(k=>({k,n:swName(k)})).concat(legacyKeys(wedges).map(k=>({k,n:SW[k]})));
  const rows=(face==='square'?tbl(irons,SWINGS,'鐵桿與木桿'):'')+tbl(wedges,wcols,'挖起桿與 PW（揮桿幅度）');
  const any=allShots().length;
  return `<header><div><h1>距離表</h1><div class="sub">大字是平均總距離，小字是 carry，單位：${U()}</div></div></header>
  <div class="seg three">${['square','open','closed'].map(f=>`<button data-face="${f}" aria-pressed="${face===f}">${f==='square'?'標準桿面':FACES[f]}</button>`).join('')}</div>
  <section>${rows}</section>
  <p class="note">${any?'點任一格看每一球的明細。':'還沒有任何紀錄。到「記錄」頁打幾球，這裡就會自動算出每支桿、每種揮法的平均距離。'}
  目前統計方式：${S.statMode==='mean'?'全部平均':'排除異常球'}，可在「設定」切換。開桿面和關桿面只適用挖起桿與 PW。</p>${statusLine()}`;
}
function viewSet(){
  return `<header><div><h1>設定</h1><div class="sub">點選項目展開設定</div></div></header>
  <details class="card fold" data-sec="sec1" ${S.openSec.sec1?'open':''}><summary><span>我的球桿（依序顯示）</span><span class="sumv">${S.clubs.length} 支</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <ul class="clublist">${S.clubs.map((c,i)=>`<li><span class="nm">${esc(c)}</span>
      <button class="mini" data-up="${i}" aria-label="上移 ${esc(c)}" ${i?'':'disabled'}>↑</button>
      <button class="mini" data-down="${i}" aria-label="下移 ${esc(c)}" ${i<S.clubs.length-1?'':'disabled'}>↓</button>
      <button class="mini" data-rm="${i}" aria-label="移除 ${esc(c)}">✕</button></li>`).join('')}</ul>
    <form class="addrow" id="addform"><input id="add-club" maxlength="8" placeholder="例如 1W、3W、4H、60°"><button class="btn" type="submit">加入</button></form>
    <p class="note">移除球桿不會刪掉它的舊紀錄，距離表仍會顯示在最下方。</p></div></details>
  <details class="card fold" data-sec="sec2" ${S.openSec.sec2?'open':''}><summary><span>多裝置同步（GitHub）</span><span class="sumv">${sync.token?(sync.status==='ok'?'已同步':sync.status==='syncing'?'同步中':'需留意'):'未設定'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    ${sync.token?`<p class="note" id="sync-state">${syncText()[1]}</p>
      <div class="addrow"><button class="btn" id="sync-now" type="button">立即同步</button>
      <button class="btn ghost" id="sync-off" type="button">${S.armed==='sync-off'?'確定中斷這台裝置':'中斷這台裝置'}</button></div>
      <p class="note">每台裝置都貼上同一把金鑰，就會自動找到同一份資料。中斷只會移除這台裝置上的金鑰，雲端資料不會刪除。</p>`
    :`<p class="note">貼上 GitHub 金鑰（只需要 gist 權限）後，紀錄會存到你帳號裡的私人 Gist，手機、平板、電腦都會同步。</p>
      <form class="addrow" id="tokenform"><input id="token-in" type="password" autocomplete="off" placeholder="ghp_ 開頭的金鑰"><button class="btn" type="submit">連結</button></form>`}
  </div></details>
  <details class="card fold" data-sec="sec3" ${S.openSec.sec3?'open':''}><summary><span>挖起桿與 PW 揮桿幅度（%）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="pctlist">${S.clubs.filter(isWedge).map((c,i)=>`<form class="pctform" data-pclub="${esc(c)}">
      <label class="pctname" for="pct-in-${i}">${esc(c)}${S.pctMap[c]?'':'<small>預設</small>'}</label>
      <input id="pct-in-${i}" inputmode="decimal" value="${pctsFor(c).join(', ')}" aria-label="${esc(c)} 揮桿幅度">
      <button class="btn" type="submit">儲存</button>
      ${S.pctMap[c]?`<button class="mini wide" type="button" data-pctreset="${esc(c)}">改回預設</button>`:''}</form>`).join('')}
      <form class="pctform def" data-pclub="">
      <label class="pctname" for="pct-in-def">預設</label>
      <input id="pct-in-def" inputmode="decimal" value="${S.pcts.join(', ')}" aria-label="預設揮桿幅度">
      <button class="btn" type="submit">儲存</button></form></div>
    <p class="note">每支球桿可以各自設定，用逗號分隔，例如 54° 填 100, 80, 60, 40, 20。標示「預設」的球桿使用最下面的預設值（100% 到 10%，每 10% 一格），之後新增的挖起桿也會先用預設值。PW 和名稱以「°」結尾的球桿會用百分比記錄，並可選開桿面、標準、關桿面；其他球桿維持出力／正常全揮。舊紀錄不會因修改而消失，距離表仍會顯示。</p></div></details>
  <details class="card fold" data-sec="sec4" ${S.openSec.sec4?'open':''}><summary><span>距離單位</span><span class="sumv">${S.unit==='m'?'公尺':'碼'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="seg two"><button data-unit="yd" aria-pressed="${S.unit==='yd'}">碼</button><button data-unit="m" aria-pressed="${S.unit==='m'}">公尺</button></div>
    <p class="note">切換單位會自動換算所有舊紀錄。</p></div></details>
  <details class="card fold" data-sec="sec5" ${S.openSec.sec5?'open':''}><summary><span>匯出紀錄（CSV）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <button class="btn ghost" id="export">複製全部紀錄</button>
    <textarea id="csv" readonly hidden></textarea>
    <p class="note">複製後可以貼到 Excel 或 Google 試算表。</p></div></details>
  <details class="card fold" data-sec="sec6" ${S.openSec.sec6?'open':''}><summary><span>距離統計方式</span><span class="sumv">${S.statMode==='mean'?'全部平均':'排除異常球'}</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <div class="seg two"><button data-stat="mad" aria-pressed="${S.statMode!=='mean'}">排除異常球（建議）</button><button data-stat="mean" aria-pressed="${S.statMode==='mean'}">全部平均</button></div>
    <ol class="logic">
      <li><b>6 球以上：用 MAD 找出異常球。</b>先找這組 carry 的中位數，再算每球和中位數相差多少，取這些差距的中位數（MAD）。MAD 乘以 1.48 換算成標準差的大小，作為「正常落差」，最少 2 碼。</li>
      <li><b>異常門檻：</b>比中位數短超過 2.5 倍正常落差、或長超過 3 倍，就視為異常，不計入平均。打短多半是打肥、打薄，所以打短的門檻較嚴。</li>
      <li><b>3～5 球：</b>球數太少，不排除任何球，改用中位數，避免單一球影響太大。<b>少於 3 球：</b>直接平均。</li>
      <li><b>只用 carry 判斷：</b>滾動受地面軟硬影響大，不拿來判斷。被排除的球，滾動與總距離也一起不計。</li>
      <li><b>不會刪除資料：</b>被排除的球在明細和全部紀錄中以灰色標示「異常」，你可以自行判斷，需要時再編輯或刪除。</li>
      <li><b>全部平均：</b>所有球直接取平均，不排除任何球。</li>
      <li>每支球桿、每種揮法、每種桿面各自分開計算。選桿頁的落差（±）也是用排除異常後的球計算。</li>
    </ol></div></details>
  <details class="card fold" data-sec="sec7" ${S.openSec.sec7?'open':''}><summary><span>選桿邏輯（攻果嶺）</span><span class="chev" aria-hidden="true"></span></summary><div class="fold-body">
    <ol class="logic">
      <li><b>只填總距離：一般攻果嶺。</b>找平均總距離最接近目標的組合。選「寧長勿短」時，打短 1 碼算 1.5 碼誤差、打長 1 碼算 1 碼；「寧短勿長」則相反。</li>
      <li><b>只填 carry：必須飛過。</b>用「穩定 carry 下限」判斷，也就是平均 carry 減掉你這個組合的落差。下限要大於等於目標才列為首選，否則標示「可能飛不過」。符合的組合中挑 carry 最接近目標的，避免拿太長的桿飛過果嶺。</li>
      <li><b>兩個都填：飛過障礙＋停在目標附近。</b>先要求穩定 carry 下限飛過障礙，再挑總距離最接近目標的。若平常的滾動比「目標總距離 − carry」多 3 碼以上，會往後排並標示「可能滾過頭」，開桿面或高拋的挖起桿因此較容易被推薦。</li>
      <li><b>揮法優先順序：</b>鐵桿和木桿以正常全揮最優先，3/4 揮、半揮依序往後，出力全揮放最後。挖起桿與 PW 的各種幅度不扣分。開桿面和關桿面平常稍微往後排；兩欄都填且滾動空間不夠時，滾得少的開桿面較容易排到前面。</li>
      <li><b>穩定度與資料量：</b>落差越小越優先，落差依「距離統計方式」計算；不到 3 球時以 carry 的 5% 估算，最少 3 碼。少於 3 球的組合往後排；還沒有紀錄的球桿用一般距離估算，標示「預估」並排更後面。</li>
      <li><b>結果顯示：</b>依分數排出前 5 名。右邊大字是平均總距離（只填 carry 時是平均 carry），下方是和目標差幾碼，3 碼以內以綠色標示。小標籤依序是：能否飛過與餘裕、平常滾動、落差（±）、紀錄球數。紅色標籤表示可能飛不過或滾過頭。</li>
    </ol></div></details>${statusLine()}`;
}
function statusLine(){const[c,t]=syncText();return `<p class="status ${c}" id="syncline">${t}</p>`}
function viewDetail(){
  if(!S.detail)return'';
  const [club,swing]=S.detail, face=S.face, shots=match(club,swing,face), st=statsFor(shots);
  return `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="明細">
    <div class="sheet-head"><h2>${esc(club)}・${swName(swing)}${faceTag(face)}</h2><button class="x" data-close="1">關閉</button></div>
    ${st.n?`<div class="stats"><div class="stat"><small>平均總距離</small><b>${r0(st.total)}</b></div><div class="stat"><small>平均 carry</small><b>${r0(st.carry)}</b></div><div class="stat"><small>carry 範圍</small><b>${r0(st.min)}–${r0(st.max)}</b></div></div>
    ${st.out?`<p class="note">有 ${st.out} 球判定為異常，未計入平均。</p>`:''}
    <ul class="shots card">${shots.map(s=>shotRow(s)).join('')}</ul>`:`<p class="empty">這一格還沒有紀錄。</p>`}
  </div></div>`;
}

function notesFor(c){return(D.notes&&D.notes[c]&&D.notes[c].items)||[]}
function setNotes(c,items){D.notes=Object.assign({},D.notes,{[c]:{items,updated:Date.now()}});changed()}
function noteClubs(){const o=clubOrder();return o.concat(Object.keys(D.notes||{}).filter(c=>!o.includes(c)&&notesFor(c).length))}
function noteItems(c,editable){
  const items=notesFor(c);
  if(!items.length)return `<p class="empty">還沒有注意事項。</p>`;
  return `<ol class="nlist">${items.map(it=>S.notes.edit===it.id
    ?`<li class="nedit"><form class="nform" id="nedit-form" data-club="${esc(c)}" data-id="${it.id}"><textarea id="nedit-in" rows="3">${esc(it.text)}</textarea>
       <div class="edbtns"><button class="btn" type="submit">儲存</button><button class="btn ghost" type="button" data-ncancel="1">取消</button>
       <button class="del ${S.armed==='n'+it.id?'arm':''}" type="button" data-ndel="${it.id}" data-nclubdel="${esc(c)}">${S.armed==='n'+it.id?'確定刪除':'刪除'}</button></div></form></li>`
    :`<li><button class="nitem" data-nedit="${it.id}">${esc(it.text)}</button></li>`).join('')}</ol>`;
}
function viewNotes(){
  const clubs=noteClubs(), sel=S.notes.club==='all'||clubs.includes(S.notes.club)?S.notes.club:'all';
  const chips=`<div class="filters"><button class="fchip" data-nclub="all" aria-pressed="${sel==='all'}">全部</button>${clubs.map(c=>{const n=notesFor(c).length;return `<button class="fchip" data-nclub="${esc(c)}" aria-pressed="${sel===c}">${esc(c)}${n?` <small>${n}</small>`:''}</button>`}).join('')}</div>`;
  let body;
  if(sel==='all'){
    const withNotes=clubs.filter(c=>notesFor(c).length);
    body=withNotes.length?withNotes.map(c=>`<section class="grp"><div class="grp-h"><span class="grp-club">${esc(c)}</span><span class="grp-n">${notesFor(c).length} 項</span></div>${noteItems(c)}</section>`).join('')
      :`<p class="empty">還沒有任何注意事項。上方選一支球桿，把練球時發現的問題記下來，例如「上桿太快，頂點停一下」。</p>`;
  }else{
    body=`<section class="grp"><div class="grp-h"><span class="grp-club">${esc(sel)}</span><span class="grp-n">${notesFor(sel).length} 項・點一項可修改或刪除</span></div>${noteItems(sel)}
      <form class="nform add" id="nadd-form" data-club="${esc(sel)}"><textarea id="nadd-in" rows="2" placeholder="新增 ${esc(sel)} 的注意事項"></textarea><button class="btn" type="submit">加入</button></form></section>`;
  }
  return `<div class="notes-full" role="dialog" aria-label="球桿注意事項">
    <div class="sheet-head nhead"><h2>球桿注意事項</h2><button class="x" data-close="1">關閉</button></div>${chips}${body}</div>`;
}
function noteStrip(c){
  const items=notesFor(c);
  return `<button class="notestrip" data-notes="${esc(c)}"><span class="ns-k">${esc(c)} 注意</span><span class="ns-t">${items.length?esc(items[0].text):'尚未記錄，點這裡新增'}</span><span class="ns-n">${items.length>1?items.length+' 項 ':''}›</span></button>`;
}
function clubOrder(){const extra=[...new Set(allShots().map(s=>s.club))].filter(c=>!S.clubs.includes(c));return S.clubs.concat(extra)}
function editRow(s){
  const clubs=clubOrder(); const sw=swingsFor(s.club).slice(); if(!sw.some(x=>x.k===s.swing))sw.push({k:s.swing,n:swName(s.swing)});
  return `<li class="editing"><form class="edform" id="edform" data-id="${s.id}">
    <div class="edgrid">
      <label>球桿<select id="ed-club">${clubs.map(c=>`<option value="${esc(c)}" ${c===s.club?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label>揮法<select id="ed-swing">${sw.map(x=>`<option value="${x.k}" ${x.k===s.swing?'selected':''}>${x.n}</option>`).join('')}</select></label>
      <label>Carry（${U()}）<input id="ed-carry" inputmode="decimal" value="${r0(s.carry)}"></label>
      <label>滾動（${U()}）<input id="ed-roll" inputmode="decimal" value="${r0(s.roll)}"></label>
    </div>
    <div class="edgrid one"><label>桿面<select id="ed-face">${(facesFor(s.club).includes(faceOf(s))?facesFor(s.club):facesFor(s.club).concat(faceOf(s))).map(f=>`<option value="${f}" ${f===faceOf(s)?'selected':''}>${FACES[f]}</option>`).join('')}</select></label></div>
    <div class="edbtns"><button class="btn" type="submit">儲存</button><button class="btn ghost" type="button" data-edcancel="1">取消</button>
      <button class="del ${S.armed===s.id?'arm':''}" type="button" data-del="${s.id}">${S.armed===s.id?'確定刪除':'刪除'}</button></div>
    <p class="note">${fmtDate(s.t)} 記錄</p></form></li>`;
}
function viewAll(){
  if(!S.all.open)return'';
  const shots=allShots(), byClub={};
  for(const s of shots)(byClub[s.club]=byClub[s.club]||[]).push(s);
  const clubs=clubOrder().filter(c=>byClub[c]);
  const f=S.all.filter!=='all'&&byClub[S.all.filter]?S.all.filter:'all';
  const shown=f==='all'?clubs:[f];
  const groups=shown.map(c=>{const list=byClub[c],st=statsFor(list.filter(x=>faceOf(x)==='square'&&(x.swing==='full'||x.swing==='pct100')));
    return `<section class="grp"><div class="grp-h"><span class="grp-club">${esc(c)}</span><span class="grp-n">${list.length} 球${st.n?`・正常全揮平均總距離 ${r0(st.total)}`:''}</span></div>
    <ul class="shots allshots">${list.map(s=>S.all.edit===s.id?editRow(s):`<li class="${OUT.has(s.id)?'odd':''}"><span class="d">${fmtDate(s.t)}${OUT.has(s.id)?' <em class="oddtag">異常</em>':''}<br>${swName(s.swing)}${faceTag(faceOf(s))}</span>
      <span class="n">${r0(s.carry)}<span> +${r0(s.roll)} = ${r0(s.carry+s.roll)}</span></span>
      <button class="del" data-edit="${s.id}">編輯</button></li>`).join('')}</ul></section>`}).join('');
  return `<div class="sheet-bg" data-close="1"><div class="sheet full" role="dialog" aria-label="全部紀錄">
    <div class="sheet-head"><h2>全部紀錄・${shots.length} 球</h2><button class="x" data-close="1">關閉</button></div>
    ${shots.length?`<div class="filters"><button class="fchip" data-allf="all" aria-pressed="${f==='all'}">全部</button>${clubs.map(c=>`<button class="fchip" data-allf="${esc(c)}" aria-pressed="${f===c}">${esc(c)} <small>${byClub[c].length}</small></button>`).join('')}</div>${groups}`
    :`<p class="empty">還沒有任何紀錄。</p>`}
  </div></div>`;
}

/* ---------- render & events ---------- */
const app=document.getElementById('app');
function render(){
  const keep=document.activeElement&&document.activeElement.id;
  const c=document.getElementById('in-carry'),r=document.getElementById('in-roll');
  const cv=c?c.value:'',rv=r?r.value:'';
  app.innerHTML=S.mode==='loading'?'<p class="sub">載入中…</p>':S.view==='log'?viewLog():S.view==='table'?viewTable():S.view==='pick'?viewPick():viewSet();
  OUT=computeOutliers();
  const sh=document.getElementById('sheet'), kept={};
  sh.querySelectorAll('input[id],select[id]').forEach(el=>kept[el.id]=el.type==='checkbox'?el.checked:el.value);
  const scroller=sh.querySelector('.sheet,.notes-full'), top=scroller?scroller.scrollTop:0;
  sh.innerHTML=S.notes.open?viewNotes():S.all.open?viewAll():viewDetail();
  for(const id in kept){const el=document.getElementById(id);if(el&&sh.contains(el)){if(el.type==='checkbox')el.checked=kept[id];else el.value=kept[id]}}
  const sc2=sh.querySelector('.sheet,.notes-full');if(sc2)sc2.scrollTop=top;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===S.view));
  if(S.view==='log'){const c2=document.getElementById('in-carry'),r2=document.getElementById('in-roll');if(c2){c2.value=cv;r2.value=rv;updTotal()}}
  if(keep){const el=document.getElementById(keep);if(el&&el.tagName==='INPUT')el.focus()}
}
function num(v){const n=parseFloat(String(v).replace(/[^\d.]/g,''));return isNaN(n)?null:n}
function updTotal(){
  const c=num(document.getElementById('in-carry').value),r=num(document.getElementById('in-roll').value)||0;
  document.getElementById('tot').textContent=c==null?'—':Math.round(c+r);
  document.getElementById('save').disabled=c==null||c<=0;
}
function doSave(){
  const ci=document.getElementById('in-carry'),ri=document.getElementById('in-roll');
  const c=num(ci.value),r=num(ri.value)||0;if(c==null||c<=0)return;
  addShot(c,r);ci.value='';ri.value='';render();document.getElementById('in-carry').focus();
}
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sec)S.openSec[d.dataset.sec]=d.open},true);
document.addEventListener('change',e=>{
  if(e.target.id!=='ed-club')return;
  const sel=document.getElementById('ed-swing'),cur=sel.value,list=swingsFor(e.target.value);
  sel.innerHTML=list.map(x=>`<option value="${x.k}">${x.n}</option>`).join('');
  sel.value=list.some(x=>x.k===cur)?cur:(isWedge(e.target.value)?list[0].k:'full');
  const fs=document.getElementById('ed-face'),fcur=fs.value,fl=facesFor(e.target.value);
  fs.innerHTML=fl.map(f=>`<option value="${f}">${FACES[f]}</option>`).join('');fs.value=fl.includes(fcur)?fcur:'square';
});
document.addEventListener('input',e=>{
  if(e.target.id==='in-carry'||e.target.id==='in-roll')updTotal();
  if(e.target.id==='pk-carry'||e.target.id==='pk-total'){S.pick[e.target.id==='pk-carry'?'carry':'total']=e.target.value;document.getElementById('pick-res').innerHTML=viewPickResults()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='in-carry'){e.preventDefault();document.getElementById('in-roll').focus()}
  else if(e.target.id==='in-roll'){e.preventDefault();doSave()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='nadd-form'){e.preventDefault();const c=e.target.dataset.club,el=document.getElementById('nadd-in'),v=el.value.trim();
    if(!v){toast('請輸入內容');return}
    setNotes(c,notesFor(c).concat({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,t:Date.now()}));
    el.value='';render();toast(`已加入 ${c} 注意事項`);return}
  if(e.target.id==='nedit-form'){e.preventDefault();const c=e.target.dataset.club,id=e.target.dataset.id,v=document.getElementById('nedit-in').value.trim();
    if(!v){toast('內容不能空白，要移除請按刪除');return}
    setNotes(c,notesFor(c).map(x=>x.id===id?Object.assign({},x,{text:v}):x));S.notes.edit=null;render();toast('已更新');return}
  if(e.target.id==='edform'){e.preventDefault();
    const id=e.target.dataset.id,old=D.shots[id];if(!old)return;
    const c=num(document.getElementById('ed-carry').value),r=num(document.getElementById('ed-roll').value)||0;
    if(c==null||c<=0){toast('請輸入 carry 距離');return}
    const keepOld=(v,o)=>Math.round(toDisp(o))===v?o:Math.round(fromIn(v)*10)/10;
    D.shots[id]=Object.assign({},old,{club:document.getElementById('ed-club').value,swing:document.getElementById('ed-swing').value,
      face:document.getElementById('ed-face').value,open:document.getElementById('ed-face').value==='open',carry:keepOld(c,old.carry),roll:keepOld(r,old.roll),u:Date.now()});
    rebuild();changed();S.all.edit=null;render();toast('已更新這一球');return}
  if(e.target.id==='tokenform'){e.preventDefault();const v=document.getElementById('token-in').value.trim();
    if(!v){toast('請貼上金鑰');return}sync.token=v;sync.gistId='';saveCfg();render();doSync();return}
  if(e.target.classList.contains('pctform')){e.preventDefault();
    const club=e.target.dataset.pclub, inp=e.target.querySelector('input');
    const v=[...new Set(inp.value.split(/[,，、\s]+/).map(x=>Math.round(parseFloat(x))).filter(n=>n>0&&n<=150))].sort((a,b)=>b-a);
    if(!v.length){toast('請輸入至少一個百分比');return}
    if(club){S.pctMap=Object.assign({},S.pctMap,{[club]:v})}else S.pcts=v;
    fixSel();persistSettings();render();toast(`已更新${club||'預設'}的揮桿幅度`);return}
  if(e.target.id!=='addform')return;e.preventDefault();
  const v=document.getElementById('add-club').value.trim();if(!v)return;
  if(S.clubs.includes(v)){toast('這支球桿已經在清單裡');return}
  S.clubs=S.clubs.concat(v);persistSettings();render();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close]');if(!b)return;const d=b.dataset;
  if(d.view){S.view=d.view;S.armed=null;S.detail=null;render();window.scrollTo(0,0);return}
  if(d.close&&(e.target===b||b.tagName==='BUTTON')){S.detail=null;S.notes.open=false;S.notes.edit=null;S.all.open=false;S.all.edit=null;S.armed=null;render();return}
  if(d.notes!==undefined){S.notes={open:true,club:d.notes||'all',edit:null};S.armed=null;render();const sc=document.querySelector('#sheet .notes-full');if(sc)sc.scrollTop=0;return}
  if(d.nclub){S.notes.club=d.nclub;S.notes.edit=null;S.armed=null;render();return}
  if(d.nedit){S.notes.edit=d.nedit;S.armed=null;render();const t=document.getElementById('nedit-in');if(t)t.focus();return}
  if(d.ncancel){S.notes.edit=null;S.armed=null;render();return}
  if(d.ndel){if(S.armed==='n'+d.ndel){setNotes(d.nclubdel,notesFor(d.nclubdel).filter(x=>x.id!==d.ndel));S.notes.edit=null;S.armed=null;toast('已刪除');render()}else{S.armed='n'+d.ndel;render()}return}
  if(b.id==='open-all'){S.all.open=true;S.all.edit=null;S.armed=null;render();return}
  if(d.allf){S.all.filter=d.allf;S.all.edit=null;S.armed=null;render();const sc=document.querySelector('#sheet .sheet');if(sc)sc.scrollTop=0;return}
  if(d.edit){S.all.edit=d.edit;S.armed=null;render();return}
  if(d.edcancel){S.all.edit=null;S.armed=null;render();return}
  if(d.club!==undefined){S.sel.club=d.club;fixSel();S.armed=null;render();return}
  if(d.swing){S.sel.swing=d.swing;S.armed=null;render();return}
  if(b.id==='open-t'){S.sel.face=S.sel.face==='open'?'square':'open';render();return}
  if(d.sface){S.sel.face=d.sface;render();return}
  if(d.pctreset){const m=Object.assign({},S.pctMap);delete m[d.pctreset];S.pctMap=m;fixSel();persistSettings();render();toast(`${d.pctreset} 已改回預設`);return}
  if(d.stat){S.statMode=d.stat;persistSettings();render();return}
  if(b.id==='save'){doSave();return}
  if(b.id==='sync-now'){doSync();return}
  if(b.id==='sync-off'){if(S.armed==='sync-off'){sync.token='';sync.gistId='';sync.status='off';saveCfg();S.armed=null;toast('已中斷這台裝置的同步')}else S.armed='sync-off';render();return}
  if(d.del){if(S.armed===d.del)deleteShot(d.del);else{S.armed=d.del;render()}return}
  if(d.face){S.face=d.face;render();return}
  if(d.bias){S.pick.bias=d.bias;try{localStorage.setItem('yardbook-gh-bias',d.bias)}catch(e){}render();return}
  if(d.cell){S.detail=d.cell.split('|');S.armed=null;render();return}
  if(d.unit){S.unit=d.unit;persistSettings();render();return}
  if(d.up!==undefined){const i=+d.up,a=S.clubs.slice();[a[i-1],a[i]]=[a[i],a[i-1]];S.clubs=a;persistSettings();render();return}
  if(d.down!==undefined){const i=+d.down,a=S.clubs.slice();[a[i+1],a[i]]=[a[i],a[i+1]];S.clubs=a;persistSettings();render();return}
  if(d.rm!==undefined){S.clubs=S.clubs.filter((_,i)=>i!==+d.rm);fixSel();persistSettings();render();return}
  if(b.id==='export'){
    const rows=[['日期時間','球桿','揮桿','桿面','carry('+U()+')','滾動('+U()+')','總距離('+U()+')']]
      .concat(allShots().reverse().map(s=>{const t=new Date(s.t);return[`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`,s.club,swName(s.swing),FACES[faceOf(s)],r0(s.carry),r0(s.roll),r0(s.carry+s.roll)]}));
    const csv=rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?`"${String(x).replace(/"/g,'""')}"`:x).join(',')).join('\n');
    const ta=document.getElementById('csv');ta.value=csv;
    const fallback=()=>{ta.hidden=false;ta.focus();ta.select();toast('請長按選取文字後複製')};
    try{navigator.clipboard.writeText(csv).then(()=>toast(`已複製 ${rows.length-1} 球紀錄`),fallback)}catch(err){fallback()}
  }
});
init();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
